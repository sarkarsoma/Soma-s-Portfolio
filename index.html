      { type: 'subheading', text: 'User Flow' },
      { type: 'text', text: 'To make our ideas more tangible, the user flow was structured. The objective was also to comprehend how users would interact with our content.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_27977db6e9de46c4b99458a56ea2b7ce~mv2.png' },
      { type: 'subheading', text: 'Information Architecture' },
      { type: 'text', text: 'After the user flow was approved by the business team, we stepped ahead to add more details and clarity to our ideas via information architecture. Arranging and aligning the tasks and features of the app according to this architecture would reduce complexities for the users.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_92ff99ef7af046c4b257d9ba9e06d46c~mv2.png' },
      { type: 'heading', text: 'Design' },
      { type: 'subheading', text: 'Wireframing' },
      { type: 'text', text: 'Drawing upon Information Architecture and user flow considerations, we delved into crafting an illustrative representation of a screen interface, emphasising the allocation of space, content prioritisation, available functionalities, and expected user behaviours.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_42dca4387f51459095c34a2a71dd14f1~mv2.jpg' },
      { type: 'subheading', text: 'Final Design' },
      { type: 'text', text: 'The design journey for this interface began with an unspoken dialogue with an existing UI, allowing its spirit to gently inform the creative process. The result is a design that carries the echo of its inspiration through a deep blue colour palette, symbolizing depth and reliability while charting its course with a distinct sense of purpose and clarity.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_1e4d3224a7704a98b4cd6859366d4301~mv2.png' },
      { type: 'subheading', text: 'Final UI' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_257d65b270064e53959199d8c20233b4~mv2.png' },
      { type: 'heading', text: 'Next Steps' },
      { type: 'text', text: 'Going forward, we received a handful of feedback from our senior leadership, and started to brainstorm upon those feedbacks in order to enhance the app.' },
      { type: 'heading', text: 'Conclusion' },
      { type: 'text', text: 'It was a remarkable experience where we got the opportunity to boost morale and team spirit by encouraging employees to stay active while contributing to charitable causes, and at the same time, showcase Salesforce\u2019s commitment to well-being and social responsibility. We are looking forward to the Pace with Purpose App as a catalyst for positive change — seamlessly integrating wellness and philanthropy to create a healthier, more socially conscious workplace.' }
    ] },
  { id: 'p3', tag: 'Academic · Career Platform', title: 'Endeavor — Guiding Job-Seeking Youth in India', summary: 'An AI-assisted platform helping young job seekers in India get guidance and community support.',
    role: 'UX Designer (solo, academic)', timeline: 'Four Weeks', team: 'Academic Solo Project',
    problem: 'Job-seeking youth in India struggle to find the right guidance, and existing platforms like BigShyft and Instahyre either serve narrow niches or overwhelm users with required questions.',
    process: 'Interviewed 10 users (8 applicants, 2 recruiters) over 1:1 calls, ran a heuristic competitive analysis, then built personas, problem framing, and user flows for applying to jobs and joining community forums.',
    solution: 'An app where AI plays recommender, learner, and quiz-generator — surfacing ready-to-send community questions, tracking engagement patterns, and keeping users engaged through relevant quizzes.',
    outcome: 'A key learning emerged: an early gap in recruiter-side research required revisiting discovery — reinforcing the value of validating both sides of a two-sided marketplace.',
    stripeA: 'oklch(93% 0.03 30)', stripeB: 'oklch(97% 0.015 30)', imageLabel: 'ENDEAVOR APP SCREENS — ADD SCREENSHOT',
    bannerImage: 'https://static.wixstatic.com/media/0c9571_3b7db61c4ebb4ef6a25f0720e55e3aad~mv2.png',
    bannerAccent: 'oklch(55% 0.19 30)', bannerText: 'oklch(18% 0.01 260)', bannerSub: 'oklch(30% 0.02 260 / 0.75)',
    sections: [
      { type: 'heading', text: 'The Brief' },
      { type: 'text', text: '\u2018Endeavor\u2019 is an academic project, which targets to engage and improve the experience of the employment-seeking youth in India by providing a solution to one of their major problems.' },
      { type: 'heading', text: 'The Process' },
      { type: 'text', text: 'The Double Diamond process was followed. The discovery phase started with an initiative to get into the user\u2019s shoes. And to forge with the same I opted for primary research and prepared questionnaires before reaching out to the users directly, followed by studying the competitors and their products.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_27ed44d3e4694e4ea698a0f6284b6532~mv2.png' },
      { type: 'heading', text: 'Understanding the Users and the Field' },
      { type: 'text', text: 'To gain a clear picture of who, what, why, where and how, I opted for primary research and prepared 2 separate questionnaires — one for interviewing job-seeking youth in India and the second for the recruiter. Each interview lasted 30-45 mins, with far more follow-up questions emerging than expected. 10 people were invited over individual video calls, out of which 2 were recruiters, and the interviewees were a mix of freshers and experienced professionals.' },
      { type: 'subheading', text: 'Why the Job Seekers/Applicants?' },
      { type: 'text', text: 'As they are the primary users and hence the front and centre of the entire process, empathising with them was the top priority until the very end.' },
      { type: 'plainimage', src: 'assets/jobseekers-questionnaire-hi-res.png' },
      { type: 'subheading', text: 'Why the Recruiters?' },
      { type: 'text', text: 'They are the secondary users — excluding them would create a huge gap leading to something that would never make its way in the real world. So, to create a holistic journey, it was equally important to consider the recruiters.' },
      { type: 'plainimage', src: 'assets/recruiters-questionnaire-hi-res.png' },
      { type: 'subheading', text: 'The Reports' },
      { type: 'text', text: 'Based on the replies, reports were created, which helped demystify the mindset, needs, expectations and challenges users face when it comes to job seeking and recruiting.' },
      { type: 'subheading', text: 'Studying the Competitors' },
      { type: 'text', text: 'Jacob Nielsen\u2019s Usability Heuristics guided the competitive study. Major drawbacks found: BigShyft only caters to developers with no upfront info about this, and Instahyre bombards users with required questions right at the threshold, causing users to lose interest.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_e5ee6c2a01174db88be0a167f33fb196~mv2.png' },
      { type: 'subheading', text: 'The Insights Gained' },
      { type: 'text', text: 'Having completed research and the competitive study, all the data collected was synthesised and the insights gained were listed, with commonalities between individual pain points observed and categorised.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_852f8320eb0f4e41a1a7d87054cc72f4~mv2.jpg' },
      { type: 'heading', text: 'Persona' },
      { type: 'text', text: 'The persona was created to better empathise with real-world users — meet Roshan.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_b36f14f80fc9463283a4327ce9cb27a8~mv2.jpg' },
      { type: 'heading', text: 'Which Problem to Solve?' },
      { type: 'text', text: 'The persona helped boil the pain points down into 4 major categories, and at this stage it became essential to understand which problem would be feasible and deliverable given the stakeholders, deadline, and resources available.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_47df8ef8f7a243228687514fcd24a271~mv2.jpg' },
      { type: 'text', text: 'The simplest reason to prioritise Guidance/Counselling is that it involves the least amount of time and resource — the rest need more time, consent, and collaboration with the business/recruiter side.' },
      { type: 'heading', text: 'The Problem Statement' },
      { type: 'text', text: 'The product/service will provide proper guidance to job seekers because applicants are missing the right opportunities. How might we build a product/service so that job seekers can get their dream job?' },
      { type: 'heading', text: 'Jotting the Possibilities' },
      { type: 'text', text: 'After defining the problem statement, focus shifted to how the problem could be addressed, jotting down all possible ways — marking the close of the first diamond and the start of the second.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_11095e6860d2443a9498d0bc03bd6659~mv2.png' },
      { type: 'heading', text: 'Leveraging AI to Bridge the Gap' },
      { type: 'text', text: 'AI plays three major roles in the journey:' },
      { type: 'list', items: [
        'As a Recommender: Based on learning, AI sends the user ready-to-post questions through notifications, making the user feel more involved and valued.',
        'As a Learner: AI observes the user\u2019s moves and memorises the pattern of questions asked within each community, synthesised later for recommendations.',
        'As a Quiz Generator: To keep users engaged while upskilling, AI generates quizzes related to the user\u2019s interests.'
      ] },
      { type: 'heading', text: 'The User Flows' },
      { type: 'text', text: 'User flows for the primary goals of the app were formulated — applying for a job and submitting an application form, and joining a community forum.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_1851132fbc334e83af3949fb41a6f955~mv2.png' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_1e6805e6a3fc45cdaaeecab06215278e~mv2.png' },
      { type: 'heading', text: 'Wireframing' },
      { type: 'text', text: 'Having organised the navigation, wireframes were structured — starting with pencil and paper, followed by more structured screens.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/603377_e7bc57f8a7ca48a1ba60dc12c78a20fd~mv2.png' },
      { type: 'heading', text: 'Spelling Life into My Idea' },
      { type: 'subheading', text: 'Logo' },
      { type: 'text', text: 'The colour stands for reliability and communication. The visuals for the letter E represent a ladder for applicants to climb and achieve success.' },
      { type: 'smallimage', src: 'https://static.wixstatic.com/media/603377_358de74ac7494353ad1b782365e9d548~mv2.png' },
      { type: 'subheading', text: 'Major App Screens' },
      { type: 'text', text: 'Roshan lands on the home page where he is presented a list of recommended jobs along with easy access to other affordances. Recruiters can specify what they expect from applicants and upload videos/images for better understanding, along with ex-employee reviews to give applicants a sense of the company.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_3b7db61c4ebb4ef6a25f0720e55e3aad~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_e809d125a6424337a8f939ad1299fe81~mv2.png' },
      { type: 'text', text: 'Roshan can switch between community and individual recruiter chats. Community is the virtual space where he can seek help or answers from counsellors — people who have worked with or are working with the company and are willing to help applicants. There\u2019s also quick access to an AI-generated quiz.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_6f50a120d48b4c9abd981f6f9d93d009~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/603377_3bcf93636924427a91e22f570320f4cc~mv2.png' },
      { type: 'text', text: 'On tapping Micro Inc (Community), Roshan gets the option to join as an applicant or as a counsellor. If joining as a counsellor, users first specify their relation with the company, then wait until the company verifies them — crucial to keep security breaches and deception in check.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_bd2d33fc57cf49e19340ac2e93054c5a~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_77e7eb66ffcc4f04a92aeffb918463f6~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_16830ea49dbf406488f3f27d3c29d518~mv2.png' },
      { type: 'text', text: 'As Roshan taps on a recommendation notification, he\u2019s presented an AI-generated, ready-to-send, properly framed question, helping him go beyond his hesitation and interact actively.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/603377_decf1849d35444e5b4bf36bae382d7ee~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/603377_0c516e9b090c424ea497646402569f16~mv2.png' },
      { type: 'text', text: 'The AI keeps analysing Roshan\u2019s moves and recommends questions in the form of notifications. The AI-generated quiz also helps Roshan stay engaged and updated constantly.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_605ee9fa39ce46118f35b8d2ba808c9c~mv2.png' },
      { type: 'heading', text: 'Learnings' },
      { type: 'text', text: 'In the first go, the secondary users (recruiters) were overlooked, leading to a vast gap while advancing with the project — especially while exploring solutions. To overcome the issue, a few steps back were taken to prepare the recruiter questionnaire and repeat the discovery and definition phases. The takeaway: to forge ahead for a better vision, we often have to look back and fix the mistakes we\u2019ve committed.' }
    ] },
  { id: 'p4', tag: 'Academic · Food & Culture', title: 'SwaDish — An Indian Snack Subscription App', summary: 'Designed an experience helping people find and subscribe to regional Indian snacks they can\u2019t easily get elsewhere.',
    role: 'UX Designer (solo, academic)', timeline: 'Applied the 5 Elements of UX', team: 'Academic Solo Project',
    problem: 'Customers craving specific regional snacks had to compromise on what was available or waste time searching, with no dedicated way to find and reorder them.',
    process: 'Primary research via video-call interviews across Indian states, competitive analysis against usability heuristics, affinity mapping, personas, and journey maps comparing life before and after the app.',
    solution: 'Mid-fi screens for a multi-brand snack stop, regional categorisation, a customisable snack box, subscriptions, and a "request order" flow for items that aren\u2019t yet in stock.',
    outcome: 'Delivered a full mid-fidelity prototype and visual identity grounded in real user research across diverse Indian regions.',
    stripeA: 'oklch(93% 0.03 60)', stripeB: 'oklch(97% 0.015 60)', imageLabel: 'SWADISH APP SCREENS — ADD SCREENSHOT',
    bannerImage: 'https://static.wixstatic.com/media/0c9571_d14eb389542448fd9fc920cf7820f346~mv2.png',
    bannerAccent: 'oklch(55% 0.19 60)', bannerText: 'oklch(18% 0.01 260)', bannerSub: 'oklch(30% 0.02 260 / 0.75)',
    sections: [
      { type: 'heading', text: 'Introduction' },
      { type: 'text', text: '\u2018SwaDish\u2019 is an academic project aimed at designing an experience for an Indian Snack Subscription App.' },
      { type: 'heading', text: 'The Process' },
      { type: 'text', text: 'This project needed to be divided into blocks so that each section could be focused individually, and an intuitive experience could be designed as a whole. This is where the 5 Elements of UX come into play.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_dee4b6bddbf548f8868ca1c13ac12f18~mv2.png' },
      { type: 'heading', text: 'Research Brief' },
      { type: 'text', text: 'A thorough primary research was conducted through real-life observations and interviewing a group representing the target audience, along with a competitive analysis, following which interview briefs were drafted to draw better insights about the user and the concept. Primary research took the form of user interviews over video calls (due to the persisting COVID scenario), and competitive analysis was conducted through secondary research on competitors\u2019 websites. Inclusivity was maintained by incorporating interviewees from different Indian states with varied tastes, choices, and lifestyles.' },
      { type: 'heading', text: 'Primary Research' },
      { type: 'subheading', text: 'Observations' },
      { type: 'text', text: 'As soon as I came across the topic, I started listing my day-to-day observations about snacks in India.' },
      { type: 'list', items: [
        'People in India tend to serve various snacks and sweets when somebody visits them.',
        'Tea time with the family in the evening is mostly accompanied by snacks.',
        'Get-togethers mandatorily have snacks and sweets in the course.',
        'Certain snacks and sweets are deeply bound with particular festivals and religious occasions in India.',
        'Fasting is a common ritual in India, and a few devotees specifically consume certain snacks (e.g. Makhana) and sweets during fasts.',
        'Most Indians prefer taking snacks along with them while travelling.',
        'Snack culture has carved its way as a stress buster and \u2018timepass\u2019 while watching movies or enjoying other entertainment.'
      ] },
      { type: 'list', items: [
        'COVID-19 has prompted people to be more health- and hygiene-conscious.',
        'Urban customers are inclined towards purchasing branded packed edibles.',
        'Nowadays people are preferring national brands over regional brands.',
        'Customers have developed brand awareness and brand loyalty.',
        'Young customers are willing to try new dishes and flavours.',
        'With a rapid, busier lifestyle, customers are looking for convenience food (ready-to-eat/ready-to-cook).',
        'Customers are becoming digitally active.',
        'Students or customers staying away from families prefer purchasing smaller packets.'
      ] },
      { type: 'subheading', text: 'Questionnaire' },
      { type: 'text', text: 'The arrangement of the questions was done such that they don\u2019t make the interviewees uncomfortable to open up, refraining from bombarding them with heavy questions abruptly. The questions were aimed to understand the user\u2019s mindset, environment, culture, preferences, and challenges, among others, concerning the context.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_4dbc6a3327d94a5c8a088bffd180959c~mv2.png' },
      { type: 'heading', text: 'Reports of the Interviewees\u2019 Responses' },
      { type: 'text', text: 'The responses were categorized based on the interviewees\u2019 quotes, actions, thoughts, and emotions.' },
      { type: 'imagerow', items: [
        'https://static.wixstatic.com/media/0c9571_2e14811890244348b9a8b3398a19b6af~mv2.png',
        'https://static.wixstatic.com/media/0c9571_d0b9e3c614a24c12abef7180d6355b09~mv2.png',
        'https://static.wixstatic.com/media/0c9571_a3a7f0862100472cb23d8c28cd25db0a~mv2.png',
        'uploads/Screenshot 2026-08-06 at 1.16.35 PM.png',
        'uploads/Screenshot 2026-08-06 at 1.11.24 PM.png'
      ] },
      { type: 'heading', text: 'Competitive Analysis' },
      { type: 'text', text: 'The competitors were studied based on Jacob\u2019s three usability heuristics: visibility of system status, recognise rather than recall, and aesthetic and minimalist design.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_017736b030d4434db17cada297eae0b2~mv2.png' },
      { type: 'heading', text: 'Affinity Diagram' },
      { type: 'text', text: 'From the primary research, the pain points were noted, and the ones with similar relationships were grouped together.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_7a7cac548b114e69af6e170cad40f004~mv2.png' },
      { type: 'heading', text: 'Personas' },
      { type: 'text', text: 'Personas were created to get a less abstract and more realistic image of the target users.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_dab0bd29a37b4e7f9f243916d3ecd64a~mv2.jpg' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_e8ce7c7e6b8d4b9aaa4371cffbb263c8~mv2.jpg' },
      { type: 'heading', text: 'Priority Mapping' },
      { type: 'text', text: 'All the pain points drawn from the interviews were synthesized, and finally they boiled down to four main problems. Hence, priority mapping was done before settling on a problem statement.' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_330d6ab9611f4670b85d55cae11ec236~mv2.png' },
      { type: 'subheading', text: 'Why Availability?' },
      { type: 'text', text: 'I decided to advance with \u2018availability problems\u2019, as that would take the least time among other options. \u2018Problems related to information\u2019 had already been taken care of by one of the competitors (Snackible), so there was no point in solving it.' },
      { type: 'heading', text: 'Defining the Problem' },
      { type: 'text', text: 'Our product/service will provide better availability of desired snacks, because of which customers have to either compromise with whatever is available or waste a lot of time searching for them. How might we build a product/service which can help customers get what they are looking for?' },
      { type: 'heading', text: 'User Journey' },
      { type: 'text', text: 'Below are two states which show the difference between Abhilash\u2019s journey of online snack purchases before the launch of SwaDish and after its launch.' },
      { type: 'subheading', text: 'Journey Before SwaDish' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_7a65016ff0be4b9fa755ef94f1435ed3~mv2.png' },
      { type: 'subheading', text: 'Journey After SwaDish' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_e280182ff1674c4986d073e4bf7b46c9~mv2.png' },
      { type: 'heading', text: 'The User Flows' },
      { type: 'text', text: 'The user flows for the primary goals of the app were then drafted.' },
      { type: 'subheading', text: 'User Flow for Placing Order of a Snack' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_6e5eef70061341fd806d4766d1d3e58e~mv2.png' },
      { type: 'subheading', text: 'User Flow for Placing Order of a Customized Snack Box' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_9bedd00232c545ce98bf922da8953199~mv2.png' },
      { type: 'subheading', text: 'User Flow for Subscribing to an Item' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_fc3055a3427a4057acb76034206753d0~mv2.png' },
      { type: 'heading', text: 'The Information Architecture' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_3d6e091b61a6454e8458596a6cc0362b~mv2.png' },
      { type: 'heading', text: 'Visual Identity' },
      { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_621d921034314eb7bdacfa1b83508387~mv2.jpg' },
      { type: 'plainimage', src: 'https://static.wixstatic.com/media/0c9571_59618c02bf0a46db84d07f4976c4b692~mv2.png' },
      { type: 'heading', text: 'Designing the Screens' },
      { type: 'text', text: 'Mid-fi prototype.' },
      { type: 'subheading', text: 'Multi-brand Snack Stop' },
      { type: 'text', text: 'To give the wand of choice into the hands of customers.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_1d1b3692179c4b168320971165b2b29b~mv2.png' },
      { type: 'subheading', text: 'Regional Categorisation' },
      { type: 'text', text: 'To bridge the gap between customers and their hometown taste.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_dedb17f1782446e79d990261026d5274~mv2.png' },
      { type: 'subheading', text: 'Customisable Snack Box' },
      { type: 'text', text: 'To let customers have free and open access to purchase only what they want.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_9f3c0f5c86114c39bd52151f0177bb46~mv2.png' },
      { type: 'subheading', text: 'Add to Cart & Subscription' },
      { type: 'text', text: 'The main action buttons of the app.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_a1e4cb75e6b640dca7cc95d402ddeac9~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_25e2c14705444074b333768cfe0526b6~mv2.png' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_47304f6a03fe4d73994cc7354a4fae9d~mv2.png' },
      { type: 'subheading', text: 'Request Order' },
      { type: 'text', text: 'The feature to request an order for unavailable items.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_ecb18c2ea4884a369caa8ff6e3f26e7c~mv2.png' },
      { type: 'subheading', text: 'Request Sent' },
      { type: 'text', text: 'Confirmation of the request sent.' },
      { type: 'mobileshot', src: 'https://static.wixstatic.com/media/0c9571_01d0d3707d2e475d9267864a62cb18cc~mv2.png' }
    ] }
];

    return '<div style="display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 24px 0; border-bottom: 1px solid oklch(89% 0.012 75); position: relative;">' +
      '<div style="font-size: 13.5px; color: oklch(50% 0.01 260); font-weight: 600;">' + job.dates + '</div>' +
      '<div style="border-left: 2px solid ' + ACCENT + '; padding-left: 20px;"><div style="font-family: \'Sora\', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 5px;">' + job.role + ' · <span style="font-weight: 800; color: ' + ACCENT + ';">' + job.company + '</span></div><div style="font-size: 15px; line-height: 1.6; color: oklch(40% 0.012 260);">' + job.description + '</div></div>' +
    '</div>';
  }).join('');
  var eduHtml = educationData.map(function (edu) {
    return '<div style="border-left: 2px solid ' + ACCENT + '; padding-left: 20px;"><div style="font-family: \'Sora\', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 4px;">' + edu.degree + '</div><div style="font-size: 14px; color: oklch(50% 0.01 260); font-weight: 600;">' + edu.meta + '</div></div>';
  }).join('');
  var recHtml = recognitionsData.map(function (rec) {
    return '<div style="border-left: 2px solid ' + ACCENT + '; padding-left: 20px;"><div style="font-family: \'Sora\', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 3px;">' + rec.title + ' <span style="font-weight: 600; color: oklch(50% 0.01 260); font-size: 14px;">· ' + rec.meta + '</span></div><div style="font-size: 14.5px; line-height: 1.6; color: oklch(40% 0.012 260);">' + rec.description + '</div></div>';
  }).join('');
  var skillsHtml = skillGroupsData.map(function (grp) {
    return '<div><div style="font-size: 13px; font-weight: 700; color: ' + ACCENT + '; margin-bottom: 12px;">' + grp.label + '</div><div style="display: flex; flex-direction: column; gap: 8px;">' + grp.items.map(function (item) { return '<span style="font-size: 14.5px; color: oklch(32% 0.012 260); padding: 8px 14px; background: oklch(94% 0.014 75); border-radius: 9px; border: 1px solid oklch(89% 0.012 75);">' + item + '</span>'; }).join('') + '</div></div>';
  }).join('');
  return '<section class="fadeup" style="padding: 96px 56px 108px; max-width: 1120px; margin: 0 auto;">' +
    '<h1 style="font-family: \'Sora\', sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 26px;">About me</h1>' +
    '<p style="font-size: 17.5px; line-height: 1.75; color: oklch(35% 0.012 260); margin: 0 0 20px;">I am a Full-Stack UX/Product Designer with nearly 4 years of experience delivering end-to-end product design for enterprise SaaS, CRM, telecommunications, and AI-powered products at Verizon and Salesforce.</p>' +
    '<p style="font-size: 17.5px; line-height: 1.75; color: oklch(35% 0.012 260); margin: 0 0 20px;">Whether I\'m talking to users, mapping messy processes, or collaborating with cross-functional teams, I love uncovering the "why" behind problems and designing solutions that balance user needs with business goals. I am passionate about human-centered design, accessibility (WCAG), design systems, and creating thoughtful experiences that make technology easier to use.</p>' +
    '<a class="resume-link" href="' + RESUME_URL + '" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; margin: 8px 0 60px; background: transparent; color: oklch(15% 0.01 260); padding: 12px 23px; border-radius: 100px; font-size: 14.5px; font-weight: 600; border: 1.5px solid oklch(15% 0.01 260 / 0.35);">R\u00e9sum\u00e9 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1.5px;"><path d="M12 3v13m0 0-4.5-4.5M12 16l4.5-4.5"></path><path d="M4 20h16"></path></svg></a>' +
    '<h2 style="font-family: \'Sora\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;">Experience</h2>' +
    '<div style="display: flex; flex-direction: column; gap: 0; margin-bottom: 60px;">' + expHtml + '</div>' +
    '<h2 style="font-family: \'Sora\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;">Education</h2>' +
    '<div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 60px;">' + eduHtml + '</div>' +
    '<h2 style="font-family: \'Sora\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;">Recognitions</h2>' +
    '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 60px;">' + recHtml + '</div>' +
    '<h2 style="font-family: \'Sora\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;">Skills</h2>' +
    '<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;">' + skillsHtml + '</div>' +
  '</section>';
}

function render() {
  var html = '';
  if (state.view === 'home') html = renderHome();
  else if (state.view === 'work') html = renderWorkList();
  else if (state.view === 'about') html = renderAbout();
  else if (state.view === 'case') html = renderCaseStudy(projectsData.find(function (p) { return p.id === state.activeId; }) || projectsData[0]);
  document.getElementById('main-content').innerHTML = html;

  ['home', 'work', 'about'].forEach(function (v) {
    var active = (v === 'home' && state.view === 'home') || (v === 'work' && (state.view === 'work' || state.view === 'case')) || (v === 'about' && state.view === 'about');
    document.getElementById('nav-' + v).className = 'nav-item' + (active ? ' active' : '');
  });
}

render();
</script>
</body>
</html>
