  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 28px;\">\n      <div>\n        <div style=\"font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.01em;\">Let's talk.<\u002Fdiv>\n        <p style=\"font-size: 15px; color: oklch(72% 0.008 90); margin: 0; max-width: 420px; line-height: 1.6;\">Reach out for full-time roles, freelance work, or just to talk shop about UX and design thinking.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 26px; font-size: 14.5px; font-weight: 600;\">\n        <a href=\"mailto:soar.indi@gmail.com\" style=\"display: flex; align-items: center; gap: 9px; color: oklch(96% 0.005 90);\">\n          <span style=\"width: 26px; height: 26px; border-radius: 7px; background: oklch(96% 0.005 90); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"oklch(14% 0.012 260)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 17px; height: 16px\"><path d=\"M4 6h16v12H4z\"><\u002Fpath><path d=\"M4 7l8 6 8-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          soar.indi@gmail.com\n        <\u002Fa>\n        <a href=\"tel:+917870766667\" style=\"display: flex; align-items: center; gap: 9px; color: oklch(96% 0.005 90);\">\n          <span style=\"width: 26px; height: 26px; border-radius: 7px; background: oklch(96% 0.005 90); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"oklch(14% 0.012 260)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1 .36 1.99.68 2.94a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.14-1.25a2 2 0 0 1 2.11-.45c.95.32 1.94.55 2.94.68A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          +91 78707 66667\n        <\u002Fa>\n        <a href=\"https://www.linkedin.com/in/ssarkar-soarindi/\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; gap: 9px; color: oklch(96% 0.005 90);\">\n          <span style=\"width: 26px; height: 26px; border-radius: 7px; background: oklch(96% 0.005 90); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"oklch(14% 0.012 260)\" stroke=\"none\"><path d=\"M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM3.5 8.5h3v12h-3zM9.5 8.5h2.9v1.64h.04c.4-.76 1.4-1.64 2.9-1.64 3.1 0 3.66 2.04 3.66 4.7v7.3h-3v-6.47c0-1.54-.03-3.53-2.15-3.53-2.15 0-2.48 1.68-2.48 3.42v6.58h-3z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          LinkedIn\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1120px; margin: 40px auto 0; padding-top: 24px; border-top: 1px solid oklch(28% 0.01 260); font-size: 13px; color: oklch(55% 0.01 260);\">© 2026 Soma Sarkar. Designed with care :)<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<script>\nvar ACCENT = 'oklch(55% 0.19 258)';\nvar SECTION_ACCENT = ACCENT, SECTION_TINT = 'oklch(96.5% 0.014 250)', HERO_A = '#032D60', HERO_B = '#0B5CAB', HMW_COLOR = '#B4DAFF', HERO_BODY = '#D8E6F6';\nvar DARK_GRAD = 'linear-gradient(165deg, #04213F 0%, #032D60 55%, #063A76 100%)', CHAPTER_TINT = 'oklch(97.5% 0.035 95)';\nvar DARK_TEXT = '226, 239, 255', DARK_TRIM = '146, 187, 255';\nvar CARD_FLAT = false;\nvar HERO_TAGLINE = \"I'm a Full-Stack UX/Product Designer who believes great design makes life simpler. From strategy and research to polished interfaces, I transform complex problems into intuitive experiences that help people accomplish more with less effort. I'm driven by empathy and opportunity to create meaningful impact—one thoughtful design decision at a time.\";\nvar RESUME_URL = 'https://drive.google.com/file/d/1-7PfiBfhhQ7zx1l7LEEqlO9jLDWBWf4R/view?usp=sharing';\ndocument.documentElement.style.setProperty('--accent', ACCENT);\n\nvar projectsData = [\n    { id: 'p6', tag: 'Verizon · Contact Center Tools', title: 'Revolutionising Experience for Contact Center Agents', summary: '<strong style=\"color: #FF9C8C; font-weight: 800;\">What if a transferred call arrived already understood?<\u002Fstrong><br>Redesigning the call transfer experience for Verizon contact center agents, so context travels with the customer instead of being retyped \\u2014 bringing Average Handle Time down by 11.76%.',\n      role: 'Researcher, Designer', timeline: '12 Weeks', year: '2025', team: 'Tool Evolution to simplify Call Transfers', banded: true, passcode: '1',\n      bannerImage: 'img/em-2.webp', cardBannerImage: 'img/em-2.webp', cardBannerFit: 'contain', cardBannerPos: 'center center', bannerWidth: '420px',\n      problem: 'High Average Handle Time (AHT) and a lack of data on transfer reasons were driving down CSAT scores and creating operational blind spots for Verizon\\u2019s contact center.',\n      process: 'A Discover \\u2192 Define \\u2192 Ideate \\u2192 Design process combining stakeholder interviews, call listening, contextual inquiry, and journey mapping to expose exactly where transfers were breaking down.',\n      solution: 'A redesigned Call Transfer Initiator with smart department suggestions, auto-verified customer details, and AI-generated transfer notes \\u2014 removing manual typing and guesswork for agents.',\n      outcome: 'Phase 1 launched in November 2025 with an 11.76% drop in AHT; Phase 2 (waiting-time visibility, sentiment scoring) is next on the roadmap.',\n      stripeA: '#141010', stripeB: '#6E120E', imageLabel: '--', hasStripes: true,\n      bannerAccent: '#FF9C8C', bannerText: 'oklch(99% 0 0)', bannerSub: 'oklch(94% 0.01 30 / 0.85)',\n      accent: '#C4342B', actTint: 'oklch(96.5% 0.03 32)', bandTint: 'oklch(98.4% 0.014 32)', heroA: '#17100F', heroB: '#8C1A14', hmwColor: '#FFB9AC', heroBody: '#F2DED9', chapterTint: 'oklch(97.5% 0.03 32)',\n      sections: [\n        { type: 'act', part: 'Part One', text: 'Project Overview' },\n        { type: 'heading', text: 'Overview' },\n        { type: 'text', text: 'A call transfer sounds like a small thing. Inside a contact center it is where the experience quietly falls apart \\u2014 a customer who has already explained their problem once is asked to explain it again, while the agent types notes from memory and guesses which department to send them to.<br><br>Average Handle Time (AHT) kept climbing, CSAT kept slipping, and because nothing about the reason for a transfer was ever captured, the business had no way of knowing why. I was asked to redesign the call transfer tool so that <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">every transfer both feels easier for the agent and leaves behind data the business can act on<\u002Fstrong>.' },\n        { type: 'problemhero', label: 'The Problem', text: 'An agent transferring a call was holding the entire conversation in their head. They had to remember what the customer said, retype it as a note under time pressure, re-verify details the system already knew, and pick a destination from a dropdown of internal codes that did not match how departments actually work. The next agent often received little more than a name \\u2014 so the customer started over, and the reason behind the transfer disappeared with the call.', hmw: 'How might we make a transfer carry its own context \\u2014 so the receiving agent already knows the customer, the reason and the history before they say hello, and the business finally sees why transfers happen?' },\n        { type: 'heading', text: 'The Solution' },\n        { type: 'text', text: 'I designed a call transfer experience where the tool does the remembering. It listens, verifies and routes, so the agent can stay with the customer instead of <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">working the interface<\u002Fstrong>.' },\n        { type: 'pillars', color: '#C4342B', items: [\n          { title: 'Understand', icon: 'spark', text: 'The call is analysed as it happens and the transfer note is written automatically, including the outcome of previous interactions.' },\n          { title: 'Route', icon: 'map', text: 'Plain-language department suggestions replace a dropdown of internal codes, so the call reaches the right team the first time.' },\n          { title: 'Hand off', icon: 'chat', text: 'Verified customer details and history arrive with the call, so the receiving agent opens with context instead of questions.' }\n        ] },\n        { type: 'processsteps', title: 'The Process', items: [\n          { title: 'Discover', icon: 'empathise', items: ['Background research', 'Stakeholder interviews', 'Content and data analysis \\u2014 survey and user feedback', 'Contextual inquiry \\u2014 master apprentice model', 'Call listening'] },\n          { title: 'Define', icon: 'define', items: ['Clustering insights', 'Personas', 'User journey', 'Story boarding', 'Design directions'] },\n          { title: 'Ideate', icon: 'ideate', items: ['Brainstorming sessions', 'How Might We(s)', 'User flows', 'Design explorations'] },\n          { title: 'Design', icon: 'prototype', items: ['Feasibility checks with developers', 'Iterating towards the final design'] }\n        ] },\n        { type: 'act', part: 'Part Two', text: 'Understanding the Agent' },\n        { type: 'subheading', text: 'Listening Before Designing' },\n        { type: 'text', text: 'Agents are fast, and their workarounds are invisible in a spec. So I sat with them. I ran <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">stakeholder interviews<\u002Fstrong> with business and operations teams to understand what the transfer data was meant to answer, then used a <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">master\\u2013apprentice contextual inquiry<\u002Fstrong> to be walked through real transfers by the people who make them every day. Alongside that I spent time on <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">call listening<\u002Fstrong>, and analysed existing survey responses and agent feedback.<br><br>The same moment kept repeating: the agent knew exactly what needed to happen next, and the tool made them prove it twice.' },\n        { type: 'imagerow', height: '240px', noNav: true, center: true, caption: 'That\\u2019s me (in orange t-shirt) observing and taking notes at the Verizon Contact Center, Hyderabad', items: [\n          'img/em-3.webp',\n          'img/em-4.webp'\n        ] },\n        { type: 'subheading', text: 'Who I Was Designing For' },\n        { type: 'text', text: 'Two people meet in every transfer: the agent holding the context, and the customer who has already explained the problem once. The research consolidated into these two.' },\n        { type: 'personas', items: [\n          {\n            kind: 'Primary \\u2014 Internal',\n            name: 'Fatma Ahmed', role: 'Fios Tier\\u00a01 Fios Agent, Hyderabad',\n            facts: ['Age 27', '5-10 Transfer calls / day', 'AHT target 8:40', '4 tools open at once', 'Hindi / English / Telugu'],\n            quote: 'The transfer notes are never helpful. They either have a lot of information that is hard to read while the customer is already there on the call, else there is hardly anything in it. We can\\u2019t help but ask the customer again in order to support.',\n            groups: [\n              { title: 'What she is trying to do', items: [\n                'Get the customer to the right team the first time, without a callback landing back on her queue.',\n                'Keep AHT and after-call work down while still writing a note the next agent can actually use.',\n                'Avoid the awkward hold where she is reading fields instead of talking to the customer.'\n              ] },\n              { title: 'Where it breaks', items: [\n                'Re-enters account, service and issue details the CRM already has open on screen.',\n                'At times the customer lands on the call agitated, even before she offers to support, she is thrashed over the call.',\n                'No confirmation the receiving agent got her context, so she over-explains verbally on the warm handoff.'\n              ] },\n              { title: 'Workarounds observed', items: [\n                'A personal cheat-sheet of queue codes taped beside the monitor.',\n                'Copy-pastes a shorthand note template from Notepad into the transfer reason.',\n                'Pings a known agent on chat to \\u201cwatch for my transfer\\u201d.'\n              ] }\n            ]\n          },\n          {\n            kind: 'Secondary \\u2014 Customer',\n            name: 'Sam Haymen', role: 'Fios Gigabit + TV subscriber \\u00b7 6 yrs with Verizon',\n            facts: ['Age 41', 'Works from home', 'Second call this week', 'Prefers phone over chat', 'High churn risk if unresolved'],\n            quote: 'I don\\u2019t mind being passed to someone else. I mind waiting infinitely and again starting from zero when I get there \\u2014 that\\u2019s when I start looking at what else is available.',\n            groups: [\n              { title: 'What he wants', items: [\n                'One explanation of the problem, and for it to travel with him.',\n                'To know who he is being sent to and roughly how long the wait is.',\n                'A fix in this call \\u2014 no follow up calls.'\n              ] },\n              { title: 'Where it breaks', items: [\n                'Repeats account verification and the whole story to the second agent.',\n                'Silent holds with no sense of whether he is still in the queue.',\n                'Gets bounced back to the first team when the transfer was mis-routed.'\n              ] },\n              { title: 'How he reacts', items: [\n                'Starts recording ticket numbers himself, in case nothing was logged.',\n                'Rates the interaction on the agent \\u2014 not the routing that actually failed him.'\n              ] }\n            ]\n          }\n        ] },\n        { type: 'subheading', text: 'Gaps in the Current Journey' },\n        { type: 'text', text: 'Mapping the transfer end to end \\u2014 from the customer\\u2019s first explanation to the receiving agent\\u2019s first sentence \\u2014 made the breakdowns impossible to argue with.' },\n        { type: 'gapstrip', label: '', title: '', note: '**Misinterpretations might lead to further incorrect call transfers.', steps: [\n          { role: 'customer', actor: 'Customer', img: 'img/em-5.webp', title: 'Long Wait', text: 'Sam, an existing Verizon customer, calls about his Home Internet but gets stuck in a <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">six-minute IVR queue<\u002Fspan> right out of the gate.' },\n          { role: 'ivr', actor: 'IVR', img: 'img/em-6.webp', title: 'Wrong Turn', text: 'The <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">IVR misreads<\u002Fspan> his issue and routes him to Ravi in the Mobile department instead of Home Internet.' },\n          { role: 'agent', actor: 'Agent 1', img: 'img/em-7.webp', title: 'Manual Gap', text: 'After Sam explains his problem, Ravi \\u2014 in the midst of his <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">chaotic schedule<\u002Fspan> \\u2014 manually transfers him to Fatma in Home Internet, but <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">fails to include appropriate / self explanatory call notes or context<\u002Fspan>.**' },\n          { role: 'agent', actor: 'Agent 2', img: 'img/em-8.webp', title: 'Groundhog Day', text: 'Sam <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">unexpectedly waits<\u002Fspan> another ten minutes for Fatma, only to find she has <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">negligible info<\u002Fspan> and he has to <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">explain everything for a third time<\u002Fspan>.' },\n          { role: 'clock', actor: 'High AHT', img: 'img/em-9.webp', title: 'Fallout', text: '<span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">Broken hand-offs<\u002Fspan> like these spike the AHT and leave Sam feeling <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">frustrated and undervalued<\u002Fspan>, putting his <span style=\"background: color-mix(in oklch, #C4342B 16%, white); padding: 1px 0; box-shadow: 0 0 0 3px color-mix(in oklch, #C4342B 16%, white); border-radius: 2px;\">relationship with Verizon<\u002Fspan> at stake.' }\n        ] },\n        { type: 'findings', label: 'What the journey exposed', items: [\n          { icon: 'people', title: 'Context dies at the hand-off', text: 'Everything the customer explained lived in the first agent\\u2019s memory. Notes were typed manually, often after the call, so the receiving agent started from almost nothing.' },\n          { icon: 'gift', title: 'Routing was a guess', text: 'Department names in the dropdown did not match how teams are organised, so agents relied on habit \\u2014 and misrouted calls came back around as repeat transfers.' },\n          { icon: 'eye', title: 'The business was blind', text: 'No structured reason was captured for any transfer, so the patterns behind rising AHT and falling CSAT could not be seen, let alone fixed.' }\n        ] },\n        { type: 'subheading', text: 'The Tools Agents Were Living In' },\n        { type: 'text', text: 'The existing initiator and receiver had been extended for years without being rethought. Before proposing anything new, I documented what agents were actually working with.' },\n        { type: 'imagepair', items: [\n          { src: 'img/em-10.webp', caption: 'Transfer initiator' },\n          { src: 'img/em-11.webp', caption: 'Transfer receiver' }\n        ] },\n        { type: 'subheading', text: 'Flaws in the Call Transfer Initiator' },\n        { type: 'text', text: 'For the agent starting a transfer, nearly every field asked for something the system already knew \\u2014 or something only the customer could repeat.' },\n        { type: 'flawgroups', src: 'img/em-12.webp', caption: 'The existing Call Transfer Initiator, annotated during the audit.', groups: [\n          { title: 'Issues in transferring the call', items: ['Both the cold and warm transfer buttons stay highlighted \\u2014 they should surface only when they apply', 'No indication of how long the warm transfer will take'] },\n          { title: 'Issues in finding a department', items: ['No department categorisation', 'Destination dropdown has far too many options', 'No clarity on whether the destination department is available', 'No mention of estimated waiting time'] },\n          { title: 'Ineffective note taking system', items: ['Notes are difficult to type while the customer is on the line', 'Errors have to be spotted and resolved manually'] }\n        ] },\n        { type: 'subheading', text: 'Flaws in the Call Transfer Receiver' },\n        { type: 'text', text: 'And for the agent receiving the call, the screen said almost nothing about who was on the line or why they were being sent over.' },\n        { type: 'flawgroups', src: 'img/em-13.webp', caption: 'The Call Transfer Receiver as it appeared to the receiving agent.', groups: [\n          { title: 'Missing context and sentiment about the customer', items: ['Insufficient context on the reason for transfer', 'No customer sentiment data', 'No visibility into previous actions'] },\n          { title: 'Issues in reading notes', items: ['No consistent note formatting', 'Notes are hard to read through \\u2014 and sometimes there are none at all'] },\n          { title: 'Difficulty finding customer information', items: ['No information about the customer on screen, so the agent has to verbally walk through the same questions again'] }\n        ] },\n        { type: 'act', part: 'Part Three', text: 'Framing the Opportunity' },\n        { type: 'oppcallout', label: 'The Opportunity', text: 'If the tool captured context on its own, the same change would shorten the call for the agent, spare the customer a second explanation, and hand the business the transfer data it had never had.' },\n        { type: 'heading', text: 'Design Directions' },\n        { type: 'text', text: 'Before touching screens, I framed three qualities every idea would be judged against \\u2014 shared with business, operations and engineering so we were arguing about the same thing.' },\n        { type: 'directiongrid', items: [\n          { color: '#1F7A4C', tint: 'oklch(96% 0.035 155)', icon: 'connected', title: 'Continuous', lead: 'The conversation should never restart.', items: ['No break in the customer experience', 'Persistent data hand-off between agents', 'A sense of shared workspace across the transfer'] },\n          { color: '#1B5FA8', tint: 'oklch(96% 0.03 245)', icon: 'clarity', title: 'Clear', lead: 'Nothing about the transfer should be a guess.', items: ['Plain-language departments instead of internal codes', 'No ambiguity for agents or customers \\u2014 down to the waiting time', 'Data shown in a form that can be read at a glance'] },\n          { color: '#C4342B', tint: 'oklch(96% 0.035 32)', icon: 'human', title: 'Warm', lead: 'A hand-off between people, not systems.', items: ['Avoid the technical loop of repeated questions', 'Lean towards warm transfer models', 'Give the receiving agent enough to sound human'] }\n        ] },\n        { type: 'heading', text: 'How Might We(s)' },\n        { type: 'text', text: 'The directions turned into questions the team could design against.' },\n        { type: 'list', items: [\n          'How might we ensure agents receive relevant real-time customer data and transfer notes in a quick, digestible form?',\n          'How might we reduce manual steps in transfers while keeping agents informed?',\n          'How might we help agents easily identify the correct department and minimise misrouting?',\n          'How might we capture appropriate data for the business team to take actions upon?',\n          'How might we reduce customer frustration by ensuring seamless information transfer between agents?',\n          'How might we ensure agents are fully prepared for both warm and cold transfers without adding complexity?',\n          'How might we provide agents with helpful historical insights about the customer\\u2019s journey without overwhelming them?'\n        ] },\n        { type: 'heading', text: 'Deciding What Ships First' },\n        { type: 'text', text: 'Not everything could ship at once. Working with engineering on feasibility and with the business on impact, we split the ideas into what would move AHT immediately and what needed more groundwork.' },\n        { type: 'prioritytiers', tiers: [\n          { tier: 'Must have', status: 'Launched as Phase 1 \\u2014 Nov 2025', weight: 1, items: ['Analyze the call and create notes through automation, including the outcome of previous interactions', 'Automatically summarize and share information like customer interaction history and notes from the previous conversation', 'Validate customer zip code for FiOS Home Internet'] },\n          { tier: 'Good to have', status: 'Going for Phase 2 launch', weight: 0.55, items: ['Revamp dropdown \\u2014 list clear names', 'Clearly show the waiting time, especially for cold transfers', 'Sentiment analysis and use of customer sentiment score to display satisfaction level'] },\n          { tier: 'Nice to have', status: 'On hold for now', weight: 0.25, items: ['Automatic escalation and high-priority handling for 3\\u20135x call transfers', 'AI-powered omni routing \\u2014 routes the call to the most suitable agent and provides insights into customer sentiment'] }\n        ] },\n        { type: 'act', part: 'Part Four', text: 'Crafting the New Experience' },\n        { type: 'heading', text: 'How the Flow Changed' },\n        { type: 'text', text: 'The old flow asked the agent to decide, search and type before a transfer could happen. The proposed flow moves that work to the system — the IVR data, the department suggestion and the notes are all in place before the agent reaches the transfer decision.' },\n        { type: 'flowpair', items: [\n          { label: 'Existing user flow', src: 'img/em-14.webp' },\n          { label: 'Proposed user flow', src: 'img/em-15.webp' }\n        ] },\n        { type: 'heading', text: 'The New Call Transfer Initiator' },\n        { type: 'text', text: 'The redesigned initiator asks the agent for the one thing only they know \\u2014 where the call needs to go \\u2014 and takes care of the rest. Notes are generated from the conversation, customer details arrive verified, and history from previous interactions travels with the transfer.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/em-16.webp', cols: 'minmax(0, 1.35fr) minmax(0, 0.8fr)', maxw: '1180px', caption: 'Phase 1 of the new Call Transfer Initiator: automated notes, a suggested destination and verified customer details.', label: 'What the transferring agent now gets', items: [\n          { icon: 'notes', title: 'Typing is automated', body: 'Supported fields fill themselves, so the agent is not transcribing while the customer talks.' },\n          { icon: 'route', title: 'The destination is suggested', body: 'The department \\u2014 and its sub-category \\u2014 is proposed from the conversation instead of hunted for in a dropdown.' },\n          { icon: 'search', title: 'Zip code is auto verified', body: 'Eligibility shows inline, which keeps routing accurate and opens a clean upsell moment.' },\n          { icon: 'ask', title: 'Transfer notes write themselves', body: 'The full context is drafted automatically, and the agent can still override any of it manually.' }\n        ] },\n        { type: 'subheading', text: 'The New Call Transfer Receiver' },\n        { type: 'text', text: 'The other half of the hand-off is the agent picking the call up. Instead of a name and a blank screen, they open onto a summarised note, the reason for the call, the service involved, and every department the customer has already been through.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/em-17.webp', cols: 'minmax(0, 1.35fr) minmax(0, 0.8fr)', maxw: '1180px', caption: 'The redesigned receiver view: summarised notes, verified details, transfer history and a visible call length.', label: 'What the receiving agent now sees', items: [\n          { title: 'A note they can read at a glance', body: 'The system summarises the conversation and surfaces the reason for the call and the service involved, with the critical phrase emphasised rather than buried in a paragraph.' },\n          { title: 'History instead of guesswork', body: 'The number of previous transfers and the departments already involved are listed with dates, so a repeat caller is recognised immediately.' },\n          { title: 'Time made visible', body: 'Call length is highlighted in the header, giving the agent a live sense of AHT rather than a number they only see in a report afterwards.' }\n        ] },\n        { type: 'act', part: 'Part Five', text: 'Impact & What Comes Next' },\n        { type: 'heading', text: 'Impact' },\n        { type: 'text', text: 'Phase 1 launched in November 2025. With notes generated automatically, details verified and history travelling with the call, the numbers moved within the first weeks \\u2014 and for the first time the business could see, in structured data, why calls were being transferred at all.' },\n        { type: 'findings', items: [\n          { icon: 'stopwatch', title: '11.76% lower handle time', text: 'Average Handle Time dropped from 17 minutes to 15 minutes per call.' },\n          { icon: 'route', title: '36.36% fewer misdirects', text: 'Transfers per agent fell from 5\\u20136 a day to 3\\u20134, cutting misdirect tickets and repeat hand-offs.' },\n          { icon: 'notes', title: 'Caller notes finally captured', text: 'Every transfer now leaves structured data behind, so the business can see the gaps in the system and act on them.' }\n        ] },\n        { type: 'subheading', text: 'Next Step \\u2014 Phase 2' },\n        { type: 'text', text: 'Phase 2 takes on the two things Phase 1 deliberately left alone: <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">what the departments are actually called<\u002Fstrong> and <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">how long the customer will wait<\u002Fstrong>.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/em-18.webp', cols: 'minmax(0, 1.35fr) minmax(0, 0.8fr)', maxw: '1180px', caption: 'Phase 2 concept: categorised departments with live availability and estimated waiting time.', label: 'In design for Phase 2', items: [\n          { title: 'Departments organised the way teams are', body: 'Wireless and wireline are filtered separately and grouped into plain-language categories, replacing the dropdown of internal codes.' },\n          { title: 'Waiting time before committing', body: 'Each destination shows its live wait and opening hours, so the agent can tell the customer what to expect \\u2014 or pick a team that is free right now.' }\n        ] },\n        { type: 'heading', text: 'My Learning' },\n        { type: 'text', text: 'The biggest gains in an enterprise tool rarely come from new features. They come from removing the work the tool was quietly asking people to do for it. Sitting with agents, rather than reading about them, is what made that work visible \\u2014 and pairing early with engineering is what let it ship in twelve weeks instead of staying a concept.' },\n        { type: 'thanks' }\n      ] },\n    { id: 'p1', tag: 'Salesforce · Fleet Management APP', title: 'Envisioning Fleet Management Journey', summary: '<strong style=\"color: oklch(45% 0.19 258); font-weight: 800;\">What if AI could see a fleet problem before you do?<\u002Fstrong><br>Exploring a Salesforce-centric proactive fleet-management experience that turns fragmented data into actionable decisions.',\n      role: 'Researcher and Creative Strategist', timeline: '6 Weeks', year: '2023', team: 'Team Project', banded: true,\n      problem: 'Over time, the Salesforce business team noticed increasing customer demand for Fleet Management services. The team predicted that this demand will continue to grow. As a result, they decided to develop a Salesforce-centric Fleet Management application, within the Salesforce Automobile Industry Cloud, that comprehensively addresses all major aspects of fleet management using the Salesforce intelligence model and feasible technology. This project focuses on <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">delivery truck fleet businesses<\u002Fstrong>. Further, the team decided to split the project into chunks and work in phases. So this case study is based on Sprint 1.',\n      process: 'Designing a Salesforce-centric Fleet Management application that addresses the identified market demand and aligns with customer needs. This initiative is expected to drive operational efficiency, enhance safety, simplify a fleet manager\\'s job, and improve overall customer satisfaction, positioning Salesforce as a versatile and responsive solutions provider.',\n      solution: 'A Salesforce Lightning Design System (SLDS) prototype for Sprint 1, built on Salesforce CRM Analytics, Einstein AI, and Data Cloud, covering real-time tracking, uptime management, and maintenance reminders.',\n      outcome: 'Sprint 1 shipped for business review and user onboarding, setting up the next phase of the fleet management roadmap.',\n      stripeA: 'oklch(94.5% 0.026 250)', stripeB: 'oklch(98% 0.012 250)', imageLabel: '--',\n      cardBannerFit: 'cover', cardBannerPos: 'center center',\n      cardBannerImage: 'img/em-19.webp', \n      mascots: [{ src: 'img/EINSTEIN_Coat_Point2HeadRight_SFS20_sRGB-550d6ca1.webp', side: 'left', height: '52%' }, { src: 'img/ASTRO_NoOutfit_WalkRight_SFS20_sRGB-ceb3d1a9.png', side: 'right', height: '46%' }],\n      bannerImage: 'img/fleet-banner-v3.png',\n      bannerAccent: 'oklch(55% 0.19 250)', bannerText: 'oklch(18% 0.01 260)', bannerSub: 'oklch(30% 0.02 260 / 0.75)',\n      sections: [\n        { type: 'act', part: 'Part One', text: 'Project Overview' },\n        { type: 'heading', text: 'Overview' },\n        { type: 'text', text: 'Over time, the Salesforce business team noticed increasing customer demand for Fleet Management services, and predicted the demand would keep growing. As a result, they decided to develop a Salesforce-centric Fleet Management application for the automobile industry \\u2014 one that covers all major aspects of fleet management by putting <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">AI at the centre of the experience<\u002Fstrong>. This project focuses on <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">delivery truck fleet businesses<\u002Fstrong>, and was split into phases \\u2014 this case study covers Sprint 1.' },\n        { type: 'problemhero', label: 'The Problem', text: 'A typical day in the life of a Fleet Manager involves responding to customer complaints, coordinating drivers, monitoring vehicles, managing maintenance, and dealing with unexpected incidents. Much of this requires manually piecing together information from different sources, causing managers to react to problems rather than anticipate them.', hmw: 'How might we help Fleet Managers understand what is happening across their fleet, identify what needs attention, and act before small issues become operational problems?' },\n        { type: 'heading', text: 'The Solution' },\n        { type: 'text', text: 'I designed a connected fleet-management experience that unifies vehicle, driver, maintenance, and operational data into a single place. It pairs <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">real-time visibility with analytics and AI<\u002Fstrong> to help fleet managers see what\\u2019s happening, understand why it matters, and decide what to do next.' },\n        { type: 'pillars', color: 'oklch(55% 0.19 250)', items: [\n          { title: 'Monitor', icon: 'eye', text: 'A consolidated view of fleet health and operational events in real time.' },\n          { title: 'Understand', icon: 'nodes', text: 'Connected context across vehicles, drivers, maintenance, and operations, so the why behind each event becomes clear.' },\n          { title: 'Act', icon: 'bolt', text: 'Proactive alerts and AI-assisted recommendations that surface the next-best action before small issues escalate.' }\n        ] },\n        { type: 'processsteps', title: 'The Process', items: [\n          { title: 'Empathise', icon: 'empathise', items: ['Contextual Enquiry', 'Desk Research', 'Stakeholder Interview', 'Competitive Analysis'] },\n          { title: 'Define', icon: 'define', items: ['Affinity Mapping', 'Persona', 'User Journey', 'Problem Statement and Opportunity'] },\n          { title: 'Ideate', icon: 'ideate', items: ['Design Directions', 'Wireframing', 'Aligning Salesforce Ecosystem and AI'] },\n          { title: 'Prototype', icon: 'prototype', items: ['Final Designs', 'Next Step is to validate the designs'] }\n        ] },\n        { type: 'act', part: 'Part Two', text: 'Understanding the User' },\n        { type: 'subheading', text: 'Primary & Secondary Research' },\n        { type: 'text', text: 'To understand our users, a <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">contextual enquiry<\u002Fstrong> was carried out by visiting a Fleet Management base in Chennai. The objective was to observe the ecosystem (both digital and physical), the daily motivations and operations carried out by the Fleet Manager and his subordinates, their pain-points and frustrations while performing the tasks. However, due to some crisis, we could only get a handful but valuable set of data, through observations and a very brief conversation with the Fleet Manager there. The plan could not be executed as per anticipation.<br><br>This led us to rely upon secondary research which I did through <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">desk research<\u002Fstrong> and <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">stakeholder interviews<\u002Fstrong> (Solution Engineers in this case).' },\n        { type: 'subheading', text: 'Analysis of Data Gained from the Research' },\n        { type: 'text', text: 'There was a pile of newly gained knowledge and insights from the research, so I decided to cluster them based on patterns and did an <strong style=\"color: oklch(20% 0.02 260); font-weight: 700;\">affinity mapping<\u002Fstrong>. This helped me understand the Fleet Manager\\u2019s pain points better.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/em-20.png', cols: 'minmax(0, 1.35fr) minmax(0, 0.8fr)', maxw: '1180px', caption: 'The insights were categorised under 10 recurring patterns.', label: 'Major Insights Gained', items: [\n          { title: 'Reactive & fragmented fleet management', body: 'Issues are often addressed only after they impact vehicles, drivers, or deliveries, while critical information remains scattered across systems, records, and people.' },\n          { title: 'Complex coordination & decision-making', body: 'Managing geographically distributed drivers and service teams, while accounting for traffic, weather, fuel costs, and regulations, makes prioritizing the right action difficult.' },\n          { title: 'High operational & safety overhead', body: 'Administrative work and continuous monitoring of driver behaviour consume time, leaving less capacity for proactive fleet management and safety.' }\n        ] },\n        { type: 'subheading', text: 'Let\\'s Get to Know Our User' },\n        { type: 'persona', name: 'Meet Rakesh', role: 'Fleet Manager', panel: 'img/persona-panel-light.png',\n          quote: '\\u201CI depend on the fleet, and the fleet depends on me to keep it running at peak performance\\u201D',\n          bio: ['Rakesh is a 34 year old man who lives in Chennai, Tamil Nadu with his family.<br><br>In 2020, he was hired to manage the fleet, by the owner of a medium scale fleet management business of 5 trucks and 3 drivers in Chennai, named Star Logistics.'],\n          goalsLabel: 'His goals', goals: ['Keep vehicles operational and minimise downtime', 'Ensure driver safety', 'Identify potential problems early', 'Optimise routes and delivery operations', 'Access accurate, real-time information', 'Respond quickly to unexpected events'],\n          painsLabel: 'His frustrations', pains: ['Too much information to monitor', 'Unclear priority between different issues', 'Unexpected vehicle and route disruptions', 'Difficulty keeping track of maintenance', 'Managing dispersed drivers and operations'] },\n        { type: 'text', text: 'Now let\\u2019s see how a typical working day is like in Rakesh\\u2019s life and how it impacts him and his fleet.' },\n        { type: 'daymapquotes', label: 'A Day in Rakesh\\u2019s Life',\n          stops: [\n            { time: '9:30 AM', icon: 'alert', lead: 'A delivery is late.', text: 'Rakesh starts his day with a customer complaint. He calls the driver and finds out the truck has a puncture and the driver is searching for a local mechanic.', quote: 'Why am I finding out about this only after the customer calls?' },\n            { time: '10:00 AM', icon: 'wrench', lead: 'Rakesh needs to sent roadside help for the punctured truck.', text: 'He tries to remember which mechanic can provide roadside assistance and searches through his contacts to find their number.', quote: 'I know someone who can help\\u2026 but where did I save the number?' },\n            { time: '11:00 AM', icon: 'chat', lead: 'Time to check on the rest of the fleet.', text: 'With the immediate issue partially handled, he starts juggling between WhatsApp, calls and messages to understand what everyone is doing.', quote: 'I just need to know what\\u2019s happening across my fleet.' },\n            { time: '12:30 PM', icon: 'box', lead: 'A new delivery needs to be assigned.', text: 'Rakesh coordinates with drivers and stakeholders, individually, delegates a new delivery order and sets a reminder manually so that he doesn\\u2019t forget about the delivery deadline.', quote: 'With so much going on, I hope I don\\u2019t miss something.' },\n            { time: '2:00 PM', icon: 'receipt', lead: 'A bill might still be unpaid.', text: 'During a conversation with a stakeholder, Rakesh discovers that a service bill may still be unpaid. He digs through bills and payment history to double-check.', quote: 'Why do I have to hunt for this information every time?' },\n            { time: '4:00 PM', icon: 'shield', lead: 'A driver gets fined for speeding.', text: 'Rakesh finds out only after getting a call from the police. He regrets not being able to oversee the driver\\u2019s behaviour amidst all his time-consuming tasks, that he has to manage alone.', quote: 'I wish I had known before this became a problem.' },\n            { time: 'A few days later', icon: 'truck', lead: 'A truck breaks down before a delivery.', text: 'Rakesh is preparing his team for another delivery. As soon as the truck starts, the driver notices an engine issue.<br>Rakesh seems to be absolutely unprepared and regrets not having a Plan B. Unfortunately, the servicing delays the delivery by more than 6 hours.', quote: 'If I had known earlier, I could have had a Plan B.' }\n          ] },\n        { type: 'compstudy',\n          label: 'Delving into the Existing Products',\n          intro: 'To understand how fleet management products currently address these challenges, we studied two established solutions: Eicher\\u2019s fleet management experience and Daimler\\u2019s fleet management solution.',\n          strengthsLabel: 'What they do well',\n          strengths: ['Real-time vehicle tracking', 'Fleet visibility', 'Maintenance management', 'Route planning', 'Vehicle and service history', 'Speeding and operational alerts'],\n          strengthsNote: '* Their data accuracy is still a matter of controversy',\n          gapsLabel: 'What can we use in our favour',\n          gaps: [\n            { title: 'Information is scattered and hard to read', text: 'Both products split fleet data across separate apps, so managers cannot maintain vigilance from one place, and dense metrics make the numbers slow to interpret.' },\n            { title: 'No way to reach people from inside the product', text: 'Neither product lets a manager contact a driver or stakeholder directly, so every conversation has to happen outside the tool.' },\n            { title: 'Tracking without context or a way to act', text: 'Location alone says little about the driver, the journey, or the risk, and alerts such as speeding arrive with no path to resolve them.' },\n            { title: 'Unreliable data mapping', text: 'Vehicles, drivers, and customers are often mismatched, which erodes managers\\u2019 trust in what the product reports.' }\n          ],\n          oppLabel: 'The opportunity for Salesforce',\n          opp: 'Rather than building another tracking tool, we saw an opportunity to create a connected fleet management experience that combines visibility with context and actionable information.' },\n        { type: 'act', part: 'Part Three', text: 'Framing the Opportunity' },\n        { type: 'heading', text: 'Design Directions' },\n        { type: 'text', text: 'Before jumping into screens, we framed three directions the experience had to hold on to \\u2014 each one answering a gap we found in the existing products.' },\n        { type: 'directiongrid', items: [\n          { title: 'Connected', icon: 'connected', color: '#3A6EA8', tint: 'oklch(96% 0.022 250)', lead: 'One place for the whole fleet.',\n            items: ['vehicle, driver, maintenance and customer data live in one place', 'no more jumping between tools or calls and messages to complete a task', 'reaching a driver or stakeholder happens inside the product'] },\n          { title: 'Predictive', icon: 'predictive', color: '#5C92CE', tint: 'oklch(97% 0.018 235)', lead: 'Analytics and AI ahead of the problem.',\n            items: ['analytics and AI flag risk before it becomes downtime', 'managers are told what needs attention, not just what happened', 'recurring issues across vehicles and routes are detected automatically, without digging through reports'] },\n          { title: 'Actionable', icon: 'actionable', color: '#2B5C90', tint: 'oklch(96% 0.02 262)', lead: 'Every signal has a next step.',\n            items: ['every alert carries a clear next step', 'context travels with the information \\u2014 who, where, why it matters', 'decisions can be made and logged in the same view'] }\n        ] },\n        { type: 'heading', text: 'Opportunity into Action' },\n        { type: 'text', text: 'With the key opportunities and directions defined, I began exploring how the fleet manager could move from <strong style=\"color: #000; font-weight: 700;\">monitoring \\u2192 understanding \\u2192 action<\u002Fstrong> within a single experience.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/Frame-12.jpg', cols: 'minmax(0, 0.8fr) minmax(0, 1.35fr)', maxw: '1180px', flip: true,\n          caption: 'Early conceptualizations-Fleet dashboard, dispatching checklist, trip status, order allocation, driver dashboard, and attention/problem detail views.',\n          label: 'The early concepts focused on',\n          items: [\n            'One dashboard for fleet, attention and tasks',\n            'Trip status framed by what is late or at risk',\n            'Alerts paired with reasons and next best steps',\n            'Driver, truck and route details kept together',\n            'Maintenance history in operational context'\n          ] },\n        { type: 'act', part: 'Part Four', text: 'The Designed Experience' },\n        { type: 'heading', text: 'Designing for the Salesforce ecosystem' },\n        { type: 'text', text: 'The concept is scoped to sit on Salesforce’s own ecosystem, using these capabilities to bridge the gap between fleet data and actionable decision-making:' },\n        { type: 'list', items: [\n          '<strong style=\"color: #000; font-weight: 700;\">Salesforce Lightning Design System (SLDS)<\u002Fstrong> — Keep the interface consistent with the wider Salesforce experience.',\n          '<strong style=\"color: #000; font-weight: 700;\">CRM Analytics + Tableau<\u002Fstrong> — Turn fleet data into actionable insights.',\n          '<strong style=\"color: #000; font-weight: 700;\">Einstein AI<\u002Fstrong> — Enable predictions, alerts, and recommendations.',\n          '<strong style=\"color: #000; font-weight: 700;\">Data Cloud<\u002Fstrong> — Connect data across fleet operations.',\n          '<strong style=\"color: #000; font-weight: 700;\">MuleSoft<\u002Fstrong> — Integrate external mapping and location services.',\n          '<strong style=\"color: #000; font-weight: 700;\">Lightning Platform + Heroku<\u002Fstrong> — Support future development and scalability.'\n        ] },\n        { type: 'text', text: '<strong style=\"color: #000; font-weight: 700;\">Technology enabled the solution; user needs defined it.<\u002Fstrong>' },\n        { type: 'mockupchapters', chapters: [\n          { n: '01', title: 'Daily Command Centre', tone: 'light',\n            blurb: 'The screens Rakesh opens first — what needs attention today, ordered by how far each trip has drifted from plan.',\n            phones: [\n              { src: 'img/2.0-acb5dad0.png', solves: 'Scattered fleet information', product: 'CRM Analytics', caption: 'Dashboard', notes: [\n                  { side: 'left', top: '15%', label: 'Alerts first', body: 'Trips that have drifted sit above everything else, each with a direct route into the fleet view.' },\n                  { side: 'left', top: '34%', label: 'Tasks, split', body: 'Today’s operational work kept separate from longer-term strategic work reducing cognitive load.' },\n                  { side: 'left', top: '62%', label: 'One health number', body: 'Fleet efficiency reduced to a single figure with a plain verdict and a Diagnose action.' }\n              ] },\n              { src: 'img/4.0.png', solves: 'Tracking without context', product: 'Field Service', caption: 'All Trips', notes: [\n                  { side: 'right', top: '12%', label: 'Schedule, not location', body: 'Every trip states hours ahead or behind — delay is the decision trigger.' },\n                  { side: 'right', top: '46%', label: 'Use of visuals to aid cognitive load', body: 'The images of each truck model is shown so that relating to it takes no effort.' },\n                  { side: 'right', top: '72%', label: 'One decision per card', body: '“More” carries the depth, so the list stays glanceable.' }\n              ] }\n            ],\n            decisions: [\n              'Opened with alerts rather than analytics',\n              'Variance written in plain language, never as a raw metric',\n              'Every card ends in an action or a route into detail'\n            ] },\n          { n: '02', title: 'Alerts, Diagnosis & Repair', tone: 'dark',\n            blurb: 'The thread this experience is built on: an alert always arrives with a reason and a next step, and the fix is booked before the manager leaves the screen.',\n            phones: [\n              { src: 'img/1.png', solves: 'Alerts with no next step', product: 'Einstein + Field Service', caption: 'Trip Alert', notes: [\n                  { side: 'left', top: '30%', label: 'Simplifying interpretation through visuals', body: 'Ideal versus present location on the route says more than a number could.' },\n                  { side: 'left', top: '52%', label: 'Diagnosis, not just alert', body: 'Each alert carries the causes detected behind it.' },\n                  { side: 'left', top: '70%', label: 'Next best step', body: 'Book a service stop on route, or call the driver —who would be notified automatically.' }\n              ] },\n              { src: 'img/7.0.png', solves: 'Dense, slow-to-read metrics', product: 'Einstein Predictions', caption: 'Vehicle Diagnosis', notes: [\n              ] },\n              { src: 'img/8.0.png', solves: 'Scattered contacts and abrupt vehicle breakdowns', product: 'Field Service Scheduler', caption: 'Service Appointments', notes: [\n                  { side: 'right', top: '22%', label: 'Scheduled, then editable', body: 'Slots are proposed around trips already running rather than starting from an empty form.' },\n                  { side: 'right', top: '70%', label: 'One confirm', body: 'The whole repair plan is accepted in a single decision.' }\n              ] }\n            ],\n            decisions: [\n              'No alert without a diagnosis and a next step',\n              'Driver notification surfaced so work is never repeated',\n              'Fixes booked in context, not in a separate maintenance module'\n            ] },\n          { n: '03', title: 'Fleet & People', tone: 'light',\n            blurb: 'Trucks and drivers held in the same view — and when efficiency drops, the specific asset or person behind it is named along with a way to tackle.',\n            phones: [\n              { src: 'img/3.0.png', solves: 'Unreliable data mapping and broken connectivity', product: 'Sales Cloud assets', caption: 'Fleet', notes: [\n                  { side: 'left', top: '26%', label: 'Grouped by availability', body: 'Active and idle, for both trucks and drivers — the next question is always what is free.' },\n                  { side: 'left', top: '56%', label: 'Idle with intent', body: 'Idle assets show what they are booked for if not unassigned to not create confusion.' }\n              ] },\n              { src: 'img/6-f92c0af9.png', solves: 'Efficiency drops with no named cause', product: 'CRM Analytics', caption: 'Efficiency Influencers', notes: [\n                  { side: 'right', top: '24%', label: 'Named causes', body: 'Low fleet efficiency answered with specific trucks and drivers instead of a chart.' },\n                  { side: 'right', top: '64%', label: 'One action per row', body: 'Diagnose for a truck, Analyse for a driver — the route into detail matches what is being investigated.' }\n              ] }\n            ],\n            decisions: [\n              'Efficiency carried onto every asset row, not hidden in a report',\n              'Trucks and drivers ranked in one list, since the cause could be either',\n              'Each row given the one action that fits it, so triage never stalls'\n            ] },\n          { n: '04', title: 'Dispatch', tone: 'dark',\n            blurb: 'A new order is configured for the manager to check rather than assemble, and nothing leaves the yard without a readiness pass.',\n            phones: [\n              { src: 'img/5.png', solves: 'Mismatched vehicle–driver pairing and unforeseen route problems', product: 'Einstein Recommendations', caption: 'New Order Configuration', notes: [\n                  { side: 'left', top: '16%', label: 'AI Proposed, not assembled', body: 'Truck, driver and route arrive pre-selected with the checks they passed shown alongside.' },\n                  { side: 'left', top: '42%', label: 'Compatibility', body: 'The driver—truck pairing experienced managers do from memory, made explicit.' },\n                  { side: 'left', top: '68%', label: 'Disagree cheaply', body: '“Next Best” before falling back to a manual build.' }\n              ] },\n              { src: 'img/10.png', solves: 'Reactive, unplanned breakdowns', product: 'Field Service Mobile', caption: 'Pre-Trip Checklist', notes: [\n                  { side: 'right', top: '26%', label: 'The last gate', body: 'Briefing, documents, breakdown kit and driver health — four items, so it is actually completed.' },\n                  { side: 'right', top: '70%', label: 'Scan before departure', body: 'A fault is cheapest to catch while the truck is still on site.' }\n              ] }\n            ],\n            decisions: [\n              'Recommendation shown with its reasoning so trust is earned',\n              'Skip left available, since a blocked dispatch pushes managers off the product',\n              'Readiness treated as part of the trip flow, not a separate module',\n              'Self repair offered before escalation, with guidance matched to the driver\\u2019s confidence'\n            ] }\n        ] },\n        { type: 'act', part: 'Part Five', text: 'What I Assumed and Learned' },\n        { type: 'heading', text: 'Assumptions' },\n        { type: 'text', text: 'As this was a Sprint 1 product concept, several assumptions guided the design:' },\n        { type: 'list', items: [\n          'The initial solution was designed for the Indian market.',\n          'Users were assumed to have an active internet connection while using the application.',\n          'Fleet businesses were assumed to have OBD systems installed in their vehicles.',\n          'The underlying technologies and integrations were assumed to perform reliably.',\n          'The solution was designed as a foundation for subsequent phases rather than a complete fleet management ecosystem.'\n        ] },\n        { type: 'heading', text: 'Next Step' },\n        { type: 'text', text: 'The next step was to put the concept in front of fleet users and validate whether the proposed workflows and information hierarchy actually supported their day-to-day decision-making.' },\n        { type: 'heading', text: 'My Learning' },\n        { type: 'text', text: 'I\\u2019d end the case study with something more thoughtful than \\u201cI learned a lot.\\u201d<br><br>Designing for complex systems taught me that <strong style=\"color: #000; font-weight: 700;\">more information doesn\\u2019t always mean more visibility.<\u002Fstrong> Fleet management involves an enormous amount of data, but the real design challenge is helping people understand what matters, why it matters, and what they can do about it.<br><br><strong style=\"color: #000; font-weight: 700;\">This project also shaped how I think about AI in enterprise products:<\u002Fstrong> the best AI experience isn\\u2019t necessarily the one that adds the most intelligence \\u2014 it\\u2019s the one that removes the most unnecessary cognitive work.' },\n        { type: 'fullbleedimage', src: 'img/Group-3183683.avif', alt: 'Full screen map of the fleet management app flows' },\n        { type: 'thanks', sub: 'If any part of this made you curious \\u2014 the research, the trade-offs, or the strategy \\u2014 I\\u2019d love to talk about it.' }\n      ] },\n    { id: 'p2', tag: 'Salesforce · Wellness & Giving', title: 'Pace with Purpose — Wellness Meets Philanthropy', summary: 'Designed an internal Salesforce app turning employee step-tracking into charitable donations.',\n      mascots: [{ src: 'img/ASTRO_NoOutfit_WalkRight_SFS20_sRGB-ceb3d1a9.png', side: 'left', height: '50%' }, { src: 'img/APPY_ScoutBackpack_FaceRight_SFS20_sRGB.webp', side: 'right', height: '48%' }],\n      bannerImage: 'img/em-21.webp', cardBannerImage: 'img/em-22.webp', cardBannerFit: 'contain', cardBannerPos: 'center center', bannerWidth: '460px',\n      role: 'UX Designer', timeline: '5 Weeks', year: '2024', team: 'Salesforce App for Employees', banded: true, bandTint: 'oklch(98.4% 0.016 95)', actTint: 'oklch(96% 0.045 92)',\n      problem: 'Employees wanted to give back and stay active, but similar philanthropy programs saw low participation due to lack of motivation and poor time management.',\n      process: 'Secondary research and a competitive analysis of similar impact apps informed a persona and user flow, followed by information architecture and wireframing.',\n      solution: 'A Salesforce-integrated app with real-time activity tracking, automated donation calculations, hub selection, daily goals, leaderboards, and event reminders, in a deep blue visual identity.',\n      outcome: 'Final UI shipped to leadership for review, with feedback feeding directly into the next iteration.',\n      summary: '<strong style=\"color: #FFC94A; font-weight: 800;\">What if taking 10,000 steps could do more than improve your health?<\u002Fstrong><br>A Salesforce employee wellness experience that transforms physical activity into charitable giving—while making it easier for employees to stay motivated, connected and engaged.',\n      stripeA: '#032D60', stripeB: '#0B4A8F', imageLabel: '--',\n      bannerAccent: '#FFB60A', bannerText: 'oklch(99% 0 0)', bannerSub: 'oklch(92% 0.01 250 / 0.85)',\n      accent: '#C97C00', actTint: 'oklch(96.5% 0.03 90)', heroA: '#032D60', heroB: '#0B4A8F', hmwColor: '#FFC94A', heroBody: '#D8E6F6',\n      sections: [\n        { type: 'act', part: 'Part One', text: 'Project Overview' },\n        { type: 'heading', text: 'Overview' },\n        { type: 'text', text: 'Salesforce wanted to encourage employees to be more active while strengthening its culture of giving back.<br><br>The idea was simple:<br><strong style=\"color: #000; font-weight: 700;\">Move \\u2192 Track \\u2192 Give \\u2192 Feel motivated to do it again.<\u002Fstrong><br><br>The challenge was turning that simple idea into an experience employees would actually want to return to. The product would allow employees to track their daily activity, convert those steps into charitable contributions, participate in challenges and events, and see how their individual efforts contributed to something bigger. This is where the design challenge began.' },\n        { type: 'problemhero', label: 'The Problem', text: 'People don\\'t necessarily need another reason to care. They need a reason to <strong>keep participating<\u002Fstrong>. Employees may want to contribute to social causes, but good intentions can easily get lost in busy workdays. If participation requires too much effort, or if the impact of an individual\\'s actions isn\\'t immediately visible, motivation can quickly fade.', hmw: 'How might we turn individual motivation into collective momentum \\u2014 bringing colleagues together through opt-in team challenges, making participation feel meaningful, and helping people see the tangible impact they create, both personally and as a team.' },\n        { type: 'heading', text: 'The Solution' },\n        { type: 'text', text: 'I designed a wellness experience where everyday movement turns into a donation on its own, colleagues take part as city hubs rather than as individuals, and every contribution is reported as <strong style=\"color: #000; font-weight: 700;\">an outcome instead of an amount<\u002Fstrong>.' },\n        { type: 'pillars', color: '#C97C00', items: [\n          { title: 'Move', icon: 'steps', text: 'Steps sync from the phone or wearable, so taking part costs no extra effort in an already busy day.' },\n          { title: 'Give', icon: 'gift', text: 'Activity is converted into a contribution automatically and the cause is a single choice, not a form.' },\n          { title: 'Belong', icon: 'people', text: 'Hubs, leaderboards and events turn a private habit into something colleagues keep going together.' }\n        ] },\n        { type: 'act', part: 'Part Two', text: 'Understanding the User' },\n        { type: 'heading', text: 'Understanding the Target Audience' },\n        { type: 'text', text: 'So I went looking for the answer where it actually lived \\u2014 at the desks around me. Over the following weeks I walked the floor and sat down with peers and members of other teams who were already enrolled in similar programs, in person and over video calls, asking what made them start, what made them stop, and what would make them come back.<br><br>The same three frustrations surfaced in almost every conversation:' },\n        { type: 'findings', items: [\n          { title: '\\u201CI sign up, then work or daily chores takes over\\u201D', text: 'Everyone I spoke to had joined something like this before. Most stopped within weeks \\u2014 not from a lack of care, but because a busy day always won.' },\n          { title: '\\u201CWhere do my steps and donations actually go?\\u201D', text: 'People could not name what their activity had funded. Giving that stays abstract never becomes something they talk about or repeat.' },\n          { title: '\\u201CIt is lonely on my own\\u201D', text: 'The ones who kept going were walking with teammates or a company. Alone, the habit faded; together, a nudge from another comorade was enough to keep it alive.' }\n        ] },\n        {
