type: 'subheading', text: 'Competitive Analysis' },\n        { type: 'text', text: 'I looked at existing fitness-for-good experiences to understand how they motivate people, create community, and connect everyday movement to meaningful impact.' },\n        { type: 'compmatrix', apps: [\n          { name: 'Impact', logo: 'img/pasted-1786878843099-0.png' },\n          { name: 'Charity Miles', logo: 'img/pasted-1786878862229-0.png' },\n          { name: 'Sweatcoin', logo: 'img/pasted-1786878890251-0.png' }\n        ], rows: [\n          { need: 'Move', cells: [{ check: 1 }, { check: 1 }, { check: 1 }], opp: '' },\n          { need: 'Give back', cells: [{ check: 1 }, { check: 1 }, { check: 1 }], opp: '' },\n          { need: 'Stay motivated', cells: [{ text: 'Rewards + individual challenges' }, { text: 'Charity-driven' }, { text: 'Rewards + streaks' }], opp: 'Make motivation more meaningful' },\n          { need: 'Connect with others', cells: [{ text: 'Teams' }, { text: 'Teams' }, { text: 'Friends / Clubs' }], opp: 'Build stronger colleague participation' },\n          { need: 'Join events & group challenges', cells: [{ text: 'Company events' }, { text: 'Sponsored races' }, { text: 'Open community challenges' }], opp: 'Tie events to team challenges people opt into together' },\n          { need: 'See your impact', cells: [{ text: 'Charity contribution' }, { text: 'Miles \\u2192 money' }, { text: 'Rewards' }], opp: 'Make personal + collective impact tangible' }\n        ] },\n        { type: 'text', text: 'Existing products solved individual pieces of the experience well, but there was an opportunity to bring activity, giving, events and social motivation together into one Salesforce-centric ecosystem.' },\n        { type: 'subheading', text: 'Persona' },\n        { type: 'text', text: 'After synthesising the data gathered, the persona was defined so as to get a prominent image of the target audience\\u2019s goals, pain points and needs, in order to make appropriate design decisions.' },\n        { type: 'personacard', name: 'Meet Priya', role: 'Product Manager \\u00b7 Salesforce', slotId: 'priya', photo: 'img/persona-priya-photo.png', panelBg: 'oklch(64% 0.13 252)',\n          quote: 'I want to stay healthy and give back \\u2014 without adding one more thing to my day.',\n          bio: 'Priya works at Salesforce and spends most of her day jumping between meetings, projects and deadlines. She cares about staying healthy and often starts the week with good intentions \\u2014 getting her steps in, eating better, or joining a wellness challenge with colleagues. She also wants to give back to causes she cares about, but both tend to slip when work gets busy.<br><br>Priya doesn\\u2019t need another app asking her to <em>do more<\u002Fem>. She needs something that fits into what she\\u2019s <strong>already doing<\u002Fstrong> and reminds her that even small actions add up.',\n          facts: [\n            { label: 'Age', value: '31 years old' },\n            { label: 'Profession', value: 'Product Manager' },\n            { label: 'Location', value: 'Hyderabad, India' }\n          ],\n          goalsLabel: 'What matters to her', goals: [\n            '<strong>Staying active without making it another task.<\u002Fstrong> She wants to move more during the day, not add to her to-do list.',\n            '<strong>Giving back in a meaningful way<\u002Fstrong> \\u2014 ideally without a separate effort.',\n            '<strong>Doing it with people she knows.<\u002Fstrong> A challenge with colleagues motivates her far more than going solo.',\n            '<strong>Knowing her effort matters.<\u002Fstrong> Seeing what her steps helped fund makes it feel worthwhile.'\n          ],\n          painsLabel: 'What gets in her way', pains: [\n            '<strong>\\u201CI\\u2019ll get to it when things slow down.\\u201D<\u002Fstrong> Busy days push wellness and giving to the bottom of the list.',\n            '<strong>Motivation doesn\\u2019t last forever.<\u002Fstrong> Starting an individual challenge is easy; staying engaged after the excitement fades is harder.',\n            '<strong>The impact can feel distant.<\u002Fstrong> If she can\\u2019t see where her effort goes, it\\u2019s hard to feel connected to the outcome.'\n          ] },\n        { type: 'oppcallout', label: 'Opportunity for Salesforce', text: 'How might we turn personal motivation into team momentum \\u2014 so colleagues move together, taking part feels worth it, and everyone can see the impact they create.' },\n        { type: 'act', part: 'Part Three', text: 'Framing the Opportunity' },\n        { type: 'heading', text: 'Design Principles' },\n        { type: 'principles', intro: 'Three principles guided the experience.', items: [\n          { title: 'Make progress visible', text: 'Users should always understand how they\\u2019re doing.' },\n          { title: 'Make impact tangible', text: 'Every step should feel connected to a meaningful outcome.' },\n          { title: 'Make participation social', text: 'Teams, events and recognition should create momentum.' }\n        ] },\n        { type: 'heading', text: 'From a Simple Idea to an Experience' },\n        { type: 'evolution',\n          lead: 'The initial idea was straightforward.',\n          seedFrom: 'Steps', seedTo: 'Donations',\n          bridge: 'But as I explored the experience, it became clear the product needed to do more than calculate donations. It needed to answer four questions:',\n          questions: [\n            'How is the user performing?',\n            'What impact has the user created?',\n            'How can taking part as a group be possible?',\n            'What keeps the user coming back?'\n          ],\n          areasLabel: 'That led me to expand the experience into five core areas',\n          areas: ['Activity', 'Impact', 'Goals', 'Community', 'Events'] },\n        { type: 'act', part: 'Part Four', text: 'Shaping the Experience' },\n        { type: 'subheading', text: 'User Flow' },\n        { type: 'text', text: 'To make our ideas more tangible, the user flow was structured. The objective was also to comprehend how users would interact with the content.' },\n        { type: 'journeypills', label: 'The core journey', steps: ['Sign in', 'Choose hub', 'Set goal', 'Track activity', 'Earn contribution', 'See impact', 'Participate', 'Return'] },\n        { type: 'image', src: 'img/Frame-63907.png' },\n        { type: 'subheading', text: 'Information Architecture' },\n        { type: 'text', text: 'The product had several different functions \\u2014 activity tracking, donations, events, hubs, goals and recognition.<br><br>The challenge was making a complex ecosystem feel simple, deciding what belongs together and, more importantly, what users need to see first.' },\n        { type: 'image', src: 'img/Frame-63908.png' },\n        { type: 'subheading', text: 'Wireframing' },\n        { type: 'text', text: 'With the architecture and flows in place, I started sketching screens \\u2014 working out where content should sit, what deserved the most attention, and how someone would actually move through each page before any visual polish entered the picture.' },\n        { type: 'image', src: 'img/Frame-63906.png' },\n        { type: 'mockupchapters', chapters: [\n          { n: '01', title: 'The Daily Loop', tone: 'light',\n            blurb: 'The two screens a user touches every day \\u2014 what today\\u2019s movement adds up to, and the moment it turns into a donation.',\n            phones: [\n              { src: 'img/Dashboard.png', caption: 'Dashboard', solves: 'Progress that never felt visible',\n                notes: [\n                  { side: 'left', top: '100px', label: 'Today first', body: 'Steps sync straight from the phone or wearable, and today\\u2019s count, hub and converted amount sit above everything else \\u2014 the answer to \\u201chow am I doing\\u201d takes no scrolling.' },\n                  { side: 'left', top: '240px', label: 'Steps as rupees', body: 'Donations are calculated automatically from tracked steps and shown on the home screen, not behind a tap \\u2014 effort reads as contribution immediately.' },\n                  { side: 'left', top: '430px', label: 'Causes below self', body: 'People check themselves first and then decide where the effort goes; the order follows that.' }\n                ] },\n              { src: 'img/Donate---2.png', caption: 'Donate Steps', solves: 'Impact that felt abstract',\n                notes: [\n                  { side: 'right', top: '130px', label: 'The payoff, largest', body: 'The converted amount is the biggest element on the screen \\u2014 the outcome leads, not the mechanics.' },\n                  { side: 'right', top: '340px', label: 'One decision', body: 'Pick a cause, confirm. No amount entry, no forms, nothing to calculate.' }\n                ] }\n            ] },\n          { n: '02', title: 'Teams & Hubs', tone: 'dark',\n            blurb: 'Where individual motivation becomes collective momentum \\u2014 city hubs ranked together, and the colleagues behind each number.',\n            phones: [\n              { src: 'img/Hub.png', caption: 'Salesforce Hubs', solves: 'No reason to take part together',\n                notes: [\n                  { side: 'left', top: '92px', label: 'Hubs are cities', body: 'Hubs are picked by office location, so belonging is immediate \\u2014 the team is a place someone already works from.' },\n                  { side: 'left', top: '195px', label: 'Own hub in place', body: 'The user\\u2019s hub is highlighted where it actually ranks rather than pinned to the top.' }\n                ] },\n              { src: 'img/Hub---Inner.png', caption: 'Inside a Hub', solves: 'Teams that felt like a leaderboard',\n                notes: [\n                  { side: 'right', top: '290px', label: 'Faces, not just bars', body: 'Leaderboards show members as people with names, ranks and badges \\u2014 recognition has to feel social to hold.' },\n                  { side: 'right', top: '485px', label: 'Rank without a podium', body: 'Every member carries their own rank, so positions further down still feel worth improving.' }\n                ] }\n            ] },\n          { n: '03', title: 'Events & Causes', tone: 'light',\n            blurb: 'Organised drives people opt into together, each with a goal stated as an outcome rather than a target amount.',\n            phones: [\n              { src: 'img/Event---1.png', caption: 'Events', solves: 'Motivation fading after week one',\n                notes: [\n                  { side: 'left', top: '200px', label: 'Register on the card', body: 'Employees can register themselves and family in one tap from browsing \\u2014 no detail page required to commit.' },\n                  { side: 'left', top: '370px', label: 'Goal upfront', body: 'Each event shows what it is raising for before anyone signs up.' }\n                ] },\n              { src: 'img/Event---2.png', caption: 'Event Detail', solves: 'Giving with no visible result',\n                notes: [\n                  { side: 'right', top: '255px', label: 'Outcome, not rupees', body: 'The goal is written as patients helped \\u2014 the number people care about.' },\n                  { side: 'right', top: '350px', label: 'Share of target', body: 'Progress as a percentage means a small contribution still reads as movement.' }\n                ] }\n            ] },\n          { n: '04', title: 'Recognition & Habit', tone: 'dark',\n            blurb: 'What keeps someone coming back \\u2014 a record of what they have built, and the reminders that make it routine.',\n            phones: [\n              { src: 'img/Achievement.png', caption: 'Milestones', solves: 'Effort with nothing to show for it',\n                notes: [\n                  { side: 'left', top: '330px', label: 'Collected elsewhere', body: 'Badges and achievements have a separate screen, showing that a person\\u2019s effort matters.' },\n                  { side: 'left', top: '150px', label: 'Totals in threes', body: 'Steps, events and donations grouped together make progress comparable at a glance.' }\n                ] },\n              { src: 'img/Profile.png', caption: 'Profile & Reminders', solves: 'Nothing bringing users back',\n                notes: [\n                  { side: 'right', top: '290px', label: 'Charted, not totalled', body: 'Contribution and steps are plotted by day \\u2014 consistency is the behaviour worth showing.' },\n                  { side: 'right', top: '400px', label: 'Reminders as commitment', body: 'Reminders switch on automatically at registration and stay editable here, framed as a personal promise rather than a system setting.' }\n                ] }\n            ] }\n        ] },\n        { type: 'subheading', text: 'Visual Identity' },\n        { type: 'text', text: 'The visual language needed to feel fresh and energetic enough for a wellness product, while still reading unmistakably as Salesforce \\u2014 so it was built on the familiar blue, then let warmer accents carry the moments of progress and giving.' },\n        { type: 'image', src: 'img/Frame-63799.png' },\n        { type: 'screenfan', label: 'Pace with Purpose', title: 'The Final Designs', screens: [\n          { src: 'img/Hub-selection---in-active.png', caption: 'Choose your hub' },\n          { src: 'img/Hub-listing-e259bd8a.png', caption: 'Hubs' },\n          { src: 'img/Homescreen-after-target-is-set--V1.png', caption: 'Home' },\n          { src: 'img/hub-detail-fit.png', caption: 'Hub detail' },\n          { src: 'img/My-Profile.png', caption: 'Profile' }\n        ] },\n        { type: 'act', part: 'Part Five', text: 'What I Would Explore Next' },\n        { type: 'heading', text: 'If I Took This Further' },\n        { type: 'text', text: 'I would love to explore:' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Personalised motivation<\u002Fstrong><br>Could the experience adapt goals based on a user\\u2019s activity patterns, energy, or engagement over time \\u2014 helping them set goals that feel achievable rather than generic?' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Smarter recommendations<\u002Fstrong><br>Could AI understand a user\\u2019s interests and participation history to recommend challenges, events or causes they might genuinely care about?' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Impact storytelling<\u002Fstrong><br>Could AI turn collective activity into simple, personalised stories \\u2014 \\u201cyour team walked 1.2M steps this month; together, you helped support\\u2026\\u201d?' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Long-term engagement<\u002Fstrong><br>How might we prevent this from becoming another short-lived wellness challenge? AI could notice engagement dropping and introduce more relevant challenges or encouragement without being intrusive.' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">AI as a thoughtful layer<\u002Fstrong><br>Rather than making AI the product, I\\u2019d explore it as a personalisation and motivation layer \\u2014 keeping the core interactions simple and human.' },\n        { type: 'heading', text: 'My Learning' },\n        { type: 'text', text: 'This project taught me that engagement isn\\u2019t always about adding more reasons to participate \\u2014 it\\u2019s about making the reason feel meaningful.' },\n        { type: 'text', text: 'I learned that activity, giving and motivation work better when they\\u2019re connected. Making progress visible, celebrating small wins, and showing the impact of everyday actions can create a stronger reason to keep participating.' },\n        { type: 'text', text: 'Most importantly, it changed how I think about designing for behaviour. We can\\u2019t make people care, but we can create experiences that make participation feel simple, social and worthwhile.' },\n        { type: 'thanks' }\n      ] },\n    { id: 'p3', tag: 'Academic · Career Platform', title: 'Endeavor — Guiding Job-Seeking Youth in India',\n      summary: '<strong style=\"color: #FFA24D; font-weight: 800;\">What if the person who has worked in the company you intend to join could answer your questions and guide you?<\u002Fstrong><br>An academic project that turns a job hunt from a silent, one-way application into a conversation \\u2014 with AI empowering young job seekers.',\n      role: 'UX Designer (solo, academic)', timeline: 'Four Weeks', year: '2022', team: 'Academic Solo Project', banded: true,\n      bandTint: 'oklch(98.4% 0.002 250)', cardStyle: 'flat', chunk: 'heading', focus: true,\n      problem: 'Job-seeking youth in India struggle to find the right guidance, and existing platforms like BigShyft and Instahyre either serve narrow niches or overwhelm users with required questions.',\n      process: 'Interviewed 10 users (8 applicants, 2 recruiters) over 1:1 calls, ran a heuristic competitive analysis, then built personas, problem framing, and user flows for applying to jobs and joining community forums.',\n      solution: 'An app where AI plays recommender, learner, and quiz-generator \\u2014 surfacing ready-to-send community questions, tracking engagement patterns, and keeping users engaged through relevant quizzes.',\n      outcome: 'A key learning emerged: an early gap in recruiter-side research required revisiting discovery \\u2014 reinforcing the value of validating both sides of a two-sided marketplace.',\n      stripeA: '#0A56BF', stripeB: '#2B8CF5', imageLabel: '--',\n      cardBannerImage: 'img/endeavor-card.png',\n      bannerImage: 'img/endeavor-banner.png',\n      _bannerImages: [\n        { src: 'img/em-23.webp', top: '42%', left: '34%', width: '145px', rotate: '-9deg', z: 1, cardTop: '46%', cardLeft: '32%' },\n        { src: 'img/em-24.webp', top: '50%', left: '50%', width: '158px', rotate: '-1deg', z: 2, cardTop: '52%', cardLeft: '50%' },\n        { src: 'img/em-25.webp', top: '58%', left: '66%', width: '150px', rotate: '7deg', z: 3, cardTop: '46%', cardLeft: '68%' }\n      ],\n      bannerAccent: '#F5821F', bannerText: 'oklch(99% 0 0)', bannerSub: 'oklch(94% 0.012 250 / 0.85)',\n      accent: '#D8690B', actTint: 'oklch(96.4% 0.004 250)', heroA: '#0A56BF', heroB: '#2B8CF5', hmwColor: '#FFA24D', heroBody: '#E2EDFB',\n      darkGrad: 'linear-gradient(165deg, #14181F 0%, #1E2732 55%, #24405F 100%)', chapterTint: 'oklch(97.4% 0.003 250)', darkText: '233, 238, 244', darkTrim: '255, 178, 105',\n      sections: [\n        { type: 'act', part: 'Part One', text: 'Where It Started' },\n        { type: 'heading', text: 'Overview' },\n        { type: 'text', text: 'Endeavor began as an academic brief with a wide open scope \\u2014 improve the experience of employment-seeking youth in India by solving one of their major problems.<br><br>Almost everyone I knew had a job-hunting story, and hardly any of them were about finding the job. They were about the silence after applying, the rejection with no reason attached, and not knowing who to ask what a company was actually like. That was the thread I decided to pull.' },\n        { type: 'problemhero', label: 'The Problem', text: 'Job platforms in India are built to help people <strong>apply<\u002Fstrong>, not to help them work out what they are applying to. Applications disappear into silence, rejections arrive without a reason, and there is no one on the inside to ask what the workplace is really like \\u2014 so capable applicants keep missing opportunities they were right for, and slowly stop believing the effort is worth it.', hmw: 'How might we give a job seeker the guidance and honest company context a listing can never carry \\u2014 from the people who actually work there \\u2014 without asking them to overcome their own hesitation first?' },\n        { type: 'heading', text: 'The Solution' },\n        { type: 'text', text: 'I designed a job platform built around <strong style=\"color: #000; font-weight: 700;\">guidance and counselling<\u002Fstrong> — where employees already inside a company counsel the candidates applying to it, answering the questions a listing never will. AI lowers the cost of asking, and verification keeps every counsellor <strong style=\"color: #000; font-weight: 700;\">accountable<\u002Fstrong>.' },\n        { type: 'pillars', color: '#D8690B', items: [\n          { title: 'Guidance', icon: 'chat', text: 'Every employer carries a community, so a candidate can be guided by people who actually work there instead of guessing alone.' },\n          { title: 'Counselling', icon: 'verified', text: 'Counsellors state how they know the company and are verified by it, so the advice is personal, credible and carries a name behind it.' },\n          { title: 'Preparation', icon: 'spark', text: 'AI drafts the question he hesitates to ask, and role-based quizzes turn the wait into practice \\u2014 so he stays engaged and walks into the interview prepared.' }\n        ] },\n        { type: 'act', part: 'Part Two', text: 'Listening to Both Sides' },\n        { type: 'subheading', text: 'The Route I Took' },\n        { type: 'text', text: 'I followed the Double Diamond, and started the discovery the slow way \\u2014 with questionnaires and conversations before any assumptions about a solution.' },\n        { type: 'image', src: 'img/em-26.webp' },\n        { type: 'heading', text: 'Talking to the People Living It' },\n        { type: 'text', text: 'I wrote two questionnaires \\u2014 one for job-seeking youth, one for recruiters \\u2014 and spoke to ten people over individual video calls: eight applicants, a mix of freshers and experienced professionals, and two recruiters. Each call was planned for 30 minutes and ran closer to 45, because every answer opened another question.<br><br>Three frustrations surfaced in almost every conversation.' },\n        { type: 'findings', items: [\n          { title: '\\u201CNothing comes back\\u201D', text: 'Delayed replies, vague answers, and rejections with no reason attached. Applicants could not tell whether they were close or nowhere near.' },\n          { title: '\\u201CI don\\u2019t know what I\\u2019m missing\\u201D', text: 'Guidance was the largest cluster of all \\u2014 which skills to add, what counts as primary or secondary, and no help shaping a resume or portfolio.' },\n          { title: '\\u201CI can\\u2019t tell what the company is like\\u201D', text: 'No workplace picture, no ratings, no one on the inside to ask. Every application was a gamble on a place they could not see.' },\n          { title: '\\u201CThere are too many of them\\u201D', text: 'On the recruiter side, unlimited applicants and endless profile iterations meant good candidates were buried rather than rejected.' }\n        ] },\n        { type: 'subheading', text: 'Why the Applicants' },\n        { type: 'text', text: 'They are the primary users and the front and centre of the whole process, so empathising with them stayed the priority until the very last screen.' },\n        { type: 'plainimage', src: 'img/em-27.webp' },\n        { type: 'subheading', text: 'Why the Recruiters Too' },\n        { type: 'text', text: 'They are the secondary users, and leaving them out would have produced something that could never survive outside a classroom. A guidance product only works if the people with the answers have a reason to show up.' },\n        { type: 'plainimage', src: 'img/em-28.webp' },\n        { type: 'subheading', text: 'What the Existing Products Missed' },\n        { type: 'text', text: 'I studied the competitors against Jakob Nielsen\\u2019s usability heuristics. Two gaps stood out: BigShyft caters only to developers without ever saying so upfront, and Instahyre opens with a wall of required questions \\u2014 so people lose interest before they have seen a single job.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/603377_e5ee6c2a01174db88be0a167f33fb196~mv2.png' },\n        { type: 'subheading', text: 'Clustering What I Heard' },\n        { type: 'text', text: 'I put every insight from the interviews and the competitive study on one board and grouped the ones that kept repeating. Seven patterns came out of it, and three of them explained most of the pain.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/em-29.webp', cols: 'minmax(0, 1.25fr) minmax(0, 0.95fr)', maxw: '1180px',\n          caption: 'Insights clustered into seven recurring patterns \\u2014 guidance, response, barriers, experience, company, payment and growth.',\n          label: 'What kept repeating', items: [\n          { icon: 'silence', title: 'Guidance is missing entirely', body: 'No feedback after a rejection, no clarity on which skills matter, and no help turning experience into a resume or portfolio.' },\n          { icon: 'building', title: 'The company stays invisible', body: 'No portfolio, no workplace image, no ratings from people who have worked there \\u2014 applicants judge an employer from a listing and hope.' },\n          { icon: 'ask', title: 'Hesitation blocks the ask', body: 'Even when someone could help, applicants did not know who to approach or how to begin the conversation.' }\n        ] },\n        { type: 'heading', text: 'Here Comes the User' },\n                { type: 'personaprofile', name: 'Meet Roshan', role: 'Job Seeker \\u00b7 Uttar Pradesh, India', slotId: 'roshan', photo: 'img/persona-roshan-photo-2.png', panelBg: '#1E7BEE',\n          quote: 'I know I can do the job. I just don\\u2019t know what I\\u2019m missing \\u2014 or whom to ask.',\n          bio: 'Roshan is 27 and the only earning member in his family, responsible for his parents. He has worked in sales for nine years. In 2021 he lost his job when his workplace\\u2019s finances deteriorated, and he has been waiting for a better opportunity since.<br><br>He was never able to study in an English-medium school or pursue a master\\u2019s degree, and that still quietly holds him back every time he walks into an interview.',\n          facts: [\n            { label: 'Age', value: '27 years old' },\n            { label: 'Profession', value: '9 years in sales' },\n            { label: 'Location', value: 'Uttar Pradesh, India' }\n          ],\n          goalsLabel: 'What he wants', goals: [\n            '<strong>A stable job where he can grow.<\u002Fstrong> Somewhere his nine years of experience actually counts for something.',\n            '<strong>To know a company before applying.<\u002Fstrong> The workplace, the people, the rules \\u2014 before he commits his hopes to it.',\n            '<strong>Confidence in conversations.<\u002Fstrong> He wants to walk into an interview without rehearsing his hesitation first.',\n            '<strong>A salary that supports the family.<\u002Fstrong> He is the only person at home earning.'\n          ],\n          painsLabel: 'What gets in his way', pains: [\n            '<strong>Silence after applying.<\u002Fstrong> Late replies, vague answers, and no feedback on what went wrong.',\n            '<strong>Nobody to ask.<\u002Fstrong> He hesitates to approach strangers, and there is no experienced person around to counsel him.',\n            '<strong>No picture of the workplace.<\u002Fstrong> Missing company portfolios and unclear job descriptions turn every application into a gamble.',\n            '<strong>Paying to be seen.<\u002Fstrong> Consultancies charge a fortune, and the apps he pays for still flood his inbox.'\n          ] },\n        { type: 'oppcallout', label: 'The opportunity', text: 'The people who can answer Roshan\\u2019s questions already work at the companies he is applying to. The opportunity was to bring them inside the product \\u2014 and to remove the hesitation that stops him from asking.' },\n        { type: 'act', part: 'Part Three', text: 'Choosing the Problem Worth Solving' },\n        { type: 'heading', text: 'Four Problems, Four Weeks' },\n        { type: 'text', text: 'The persona boiled the pain points down to four problem areas, and with a four-week timeline and no access to a business or recruiter partner, I could honestly solve one.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/603377_47df8ef8f7a243228687514fcd24a271~mv2.jpg' },\n        { type: 'text', text: 'I chose <strong style=\"color: #000; font-weight: 700;\">guidance and counselling<\u002Fstrong>. It was the one problem I could deliver end to end on my own \\u2014 the others needed recruiter consent, company data, or commercial agreements I had no way to secure.' },\n        { type: 'heading', text: 'The Problem Statement' },\n        { type: 'text', text: 'Endeavor will give job seekers proper guidance, because applicants keep missing the opportunities they were right for.<br><br><strong style=\"color: #000; font-weight: 700;\">How might we build a product so that a job seeker can reach the job they actually want?<\u002Fstrong>' },\n        { type: 'heading', text: 'Design Principles' },\n        { type: 'principles', intro: 'Three principles kept the answer honest \\u2014 and kept AI in a supporting role.', items: [\n          { title: 'Guidance from people, not algorithms', text: 'The useful answers come from someone who has worked there. AI\\u2019s job is to make that exchange easier, never to imitate it.' },\n          { title: 'Lower the cost of asking', text: 'Hesitation is the real barrier, so the product should hand people the words when they cannot find them themselves.' },\n          { title: 'Show the company, not just the role', text: 'Workplace, culture and former employees belong in the listing \\u2014 before anyone spends their hope on an application.' }\n        ] },\n        { type: 'act', part: 'Part Four', text: 'Shaping the Experience' },\n        { type: 'subheading', text: 'Jotting Every Possibility' },\n        { type: 'text', text: 'With the problem framed, I wrote down every way it could be answered before judging any of them \\u2014 the close of the first diamond and the start of the second.' },\n        { type: 'image', src: 'img/em-30.webp' },\n        { type: 'heading', text: 'Bridging the Gap with AI' },\n        { type: 'text', text: 'The community was the answer; AI was what made it usable. It takes on three quiet roles \\u2014 none of which involve answering on a human\\u2019s behalf.' },\n        { type: 'pillars', color: '#1E7BEE', items: [\n          { title: 'Recommender', icon: 'eye', text: 'Sends ready-to-post questions as notifications, so getting involved costs one tap instead of an hour of drafting.' },\n          { title: 'Learner', icon: 'nodes', text: 'Observes the questions each community actually asks and remembers the pattern, so the next recommendation lands closer.' },\n          { title: 'Quiz generator', icon: 'bolt', text: 'Turns his interests into short quizzes, so the empty weeks between applications are spent upskilling.' }\n        ] },\n        { type: 'subheading', text: 'The User Flows' },\n        { type: 'text', text: 'I mapped the two journeys the product lives on \\u2014 applying for a job, and joining a community forum.' },\n        { type: 'journeypills', label: 'The core journey', steps: ['Browse recommended', 'Open a job', 'See the company', 'Join the community', 'Ask a question', 'Apply', 'Upskill', 'Return'] },\n        { type: 'image', src: 'https://static.wixstatic.com/media/603377_1851132fbc334e83af3949fb41a6f955~mv2.png' },\n        { type: 'text', text: 'The second flow covers the community \\u2014 including the branch where someone joins to help rather than to ask, and has to be verified by the company first.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/603377_1e6805e6a3fc45cdaaeecab06215278e~mv2.png' },\n        { type: 'subheading', text: 'Wireframing' },\n        { type: 'text', text: 'With the navigation settled, I worked out the screens on paper first \\u2014 what sat where, what deserved the most attention, and how someone would move through a page before any styling entered the picture.' },\n        { type: 'image', src: 'img/em-31.webp' },\n        { type: 'subheading', text: 'Everything Roshan Wanted Before Applying' },\n        { type: 'text', text: 'The job page carries what a listing usually leaves out: what the company expects, a video and images of the workplace, benefits, and reviews from people who have worked there \\u2014 all of it before the apply button asks him to commit.' },\n        { type: 'image', src: 'img/em-32.webp' },\n        { type: 'mockupchapters', chapters: [\n          { n: '01', title: 'The Job Hunt', tone: 'light',\n            blurb: 'The two screens Roshan opens first \\u2014 jobs matched to the experience he already has, and the rooms where the people behind those jobs are talking.',\n            phones: [\n              { src: 'img/em-33.webp', caption: 'Recommended Jobs', solves: 'Listings with nothing behind them', notes: [\n                { side: 'left', top: '90px', label: 'Recommended first', body: 'The app opens on roles matched to his experience, with Saved and Applied one tap away \\u2014 so coming back has a purpose.' },\n                { side: 'left', top: '250px', label: 'Company before role', body: 'Every card leads with who is hiring, because the employer was the thing he could never find out about.' }\n              ] },\n              { src: 'img/em-34.webp', caption: 'Communities', solves: 'No one to ask', notes: [\n                { side: 'right', top: '110px', label: 'Joined, then suggested', body: 'Rooms he is already part of sit above the ones he could join, so conversations he has started stay easy to return to.' },\n                { side: 'right', top: '320px', label: 'One tap to join', body: 'Joining is a single action from the list \\u2014 asking for help should not begin with a form.' }\n              ] }\n            ] },\n          { n: '02', title: 'Getting In', tone: 'dark',\n            blurb: 'A community is only worth trusting if the advice inside it is accountable, so the way in is where the design does the most work.',\n            phones: [\n              { src: 'img/em-35.webp', caption: 'Join Community As', solves: 'Advice with no accountability', notes: [\n                { side: 'left', top: '130px', label: 'Two ways in', body: 'An applicant joins to ask; a counsellor joins to answer. Naming the role at the door sets the tone of the room.' },\n                { side: 'left', top: '300px', label: 'Preview before joining', body: 'The conversation is visible but muted until he joins, so he can judge whether the room is worth entering.' }\n              ] },\n              { src: 'img/em-36.webp', caption: 'Counsellor Verification', solves: 'Impersonation and fake advice', notes: [\n                { side: 'right', top: '120px', label: 'Relation, then tenure', body: 'A counsellor states how they know the company and for how long \\u2014 the credential an applicant actually cares about.' },\n                { side: 'right', top: '300px', label: 'Verified by the company', body: 'Nothing is posted until the company confirms the relationship, which keeps deception and data leaks in check.' }\n              ] }\n            ] },\n          { n: '03', title: 'Beyond the Hesitation', tone: 'light',\n            blurb: 'The moment the whole product is built around: Roshan has a question he would never have sent on his own.',\n            phones: [\n              { src: 'img/em-37.webp', caption: 'Suggested Question', solves: 'Hesitation to start the conversation', notes: [\n                { side: 'left', top: '120px', label: 'Learned from the room', body: 'Suggestions come from what this community actually asks, not from a generic list of interview questions.' },\n                { side: 'left', top: '290px', label: 'Words already written', body: 'AI drops a properly framed question straight into the composer, so asking costs a tap instead of an evening of second-guessing.' }\n              ] },\n              { src: 'img/em-38.webp', caption: 'Asked & Answered', solves: 'Guidance that never arrives', notes: [\n                { side: 'right', top: '210px', label: 'His question, his voice', body: 'The message sends as his own, so what follows is a conversation rather than an automated exchange.' },\n                { side: 'right', top: '340px', label: 'Answers stay in the open', body: 'Replies live in the community, so the next applicant with the same doubt finds it already answered.' }\n              ] }\n            ] },\n          { n: '04', title: 'Staying in the Game', tone: 'dark',\n            blurb: 'A job hunt is mostly waiting. These screens are what gives the waiting something to do.',\n            phones: [\n              { src: 'img/em-39.webp', caption: 'AI Quiz', solves: 'Empty weeks between applications', notes: [\n                { side: 'left', top: '140px', label: 'Tied to his interests', body: 'Questions are generated around the roles he is applying for, so practice doubles as preparation.' },\n                { side: 'left', top: '310px', label: 'Points, not pressure', body: 'Short rounds with points and a retry \\u2014 enough to build a habit without feeling like an exam.' }\n              ] },\n              { src: 'img/em-40.webp', caption: 'Community Chat', solves: 'Losing momentum after a rejection', notes: [\n                { side: 'right', top: '150px', label: 'A room that keeps moving', body: 'Even on the days he is not applying, the community gives him a reason to open the app.' },\n                { side: 'right', top: '330px', label: 'Nudges with something attached', body: 'Notifications arrive carrying a question he could ask, so a reminder is useful rather than nagging.' }\n              ] }\n            ] }\n        ] },\n        { type: 'subheading', text: 'Spelling Life into the Idea' },\n        { type: 'text', text: 'The identity had to say reliability and conversation before it said anything clever. The <strong style=\\\"color: #000; font-weight: 700;\\\">E is drawn as a ladder<\\/strong> \\u2014 rungs stacking upward, so the mark reads as career growth: each rung a step Roshan takes from asking a question to landing the role. The <strong style=\\\"color: #000; font-weight: 700;\\\">blue was chosen for reliability and trust<\\/strong> \\u2014 the tone people associate with proper guidance, so the advice inside feels dependable enough to act on and follow all the way to the job they are after.' },\n        { type: 'smallimage', src: 'img/em-41.webp' },\n        { type: 'screenfan', layout: 'lineup', bg: 'linear-gradient(150deg, #2F93F7 0%, #1573DE 45%, #0A56BF 100%)', label: 'Endeavor', logo: 'img/em-41.webp', screens: [\n          { src: 'img/em-34.webp', caption: 'Communities' },\n          { src: 'img/em-38.webp', caption: 'Community chat' },\n          { src: 'img/em-33.webp', caption: 'Recommended jobs' },\n          { src: 'img/em-39.webp', caption: 'AI quiz' },\n          { src: 'img/em-42.webp', caption: 'Counsellor verification' }\n        ] },\n        { type: 'act', part: 'Part Five', text: 'Looking Back' },\n        { type: 'heading', text: 'What I Learned' },\n        { type: 'text', text: 'In the first pass I designed only for the applicants. The recruiters \\u2014 the people who would have to show up and answer \\u2014 were an afterthought, and the gap showed the moment I started exploring solutions: I was designing a conversation with only one side in the room.' },\n        { type: 'text', text: 'So I went back, wrote the recruiter questionnaire, and repeated discovery and definition. It cost me a week of a four-week project, and it is the reason the community works at all. The takeaway has stayed with me since: <strong style=\"color: #000; font-weight: 700;\">to move forward with a better vision, you often have to walk back to the mistake first.<\u002Fstrong>' },\n        { type: 'heading', text: 'If I Took This Further' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Give counsellors a reason to stay<\u002Fstrong><br>The product asks people to help without offering much in return. Recognition, or something that counts inside their own company, would be the first thing I designed next.' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Test the suggested questions with real applicants<\u002Fstrong><br>A question drafted for someone can also speak for them badly. I would want to know whether people edit the suggestion, send it as-is, or feel it is not theirs.' },\n        { type: 'text', text: '<strong style=\"font-family: \\'Sora\\', sans-serif; font-weight: 700; color: oklch(18% 0.012 260);\">Close the feedback loop<\u002Fstrong><br>The silence after a rejection was the loudest complaint in the research, and this version only routes around it. Getting recruiters to send even one line of reasoning is the harder, more valuable design problem.' },\n        { type: 'thanks' }\n      ] },\n    { id: 'p4', tag: 'Academic · Food & Culture', title: 'SwaDish — Bringing Hometown Snacks Back',\n      summary: '<strong style=\"color: #F7C86B; font-weight: 800;\">What if the snack you grew up on was never more than a tap away?<\u002Fstrong><br>An academic project that turns a scattered, compromise-filled snack hunt into one regional snack stop — where the taste of home is findable, customisable and worth coming back to.',\n      role: 'UX Designer (solo, academic)', timeline: 'Four Weeks · 5 Elements of UX', year: '2021', team: 'Academic Solo Project', banded: true,\n      bandTint: 'oklch(98.5% 0.012 62)', chunk: 'heading', focus: true,\n      problem: 'People craving a specific regional snack either compromised on whatever the nearest store or app carried, or spent far too long hunting for it — and had no reliable way to get it again.',\n      process: 'Structured with the 5 Elements of UX: observation and video-call interviews across Indian states, a heuristic competitive analysis, affinity mapping, personas, priority mapping, then flows, architecture and mid-fi screens.',\n      solution: 'A multi-brand regional snack stop with a customisable snack box, subscriptions for the things people reorder, and a request flow for snacks nobody stocks yet.',\n      outcome: 'A mid-fidelity prototype and visual identity grounded in interviews with people from very different regions, tastes and lifestyles.',\n      stripeA: '#4E140E', stripeB: '#9A3418', imageLabel: '--',\n      bannerImage: 'img/em-43.webp', showBannerOnCard: true, cardBannerPos: 'center 22%',\n      bannerAccent: '#F7C86B', bannerText: 'oklch(99% 0 0)', bannerSub: 'oklch(93% 0.02 60 / 0.85)',\n      accent: '#A8421C', actTint: 'oklch(96.5% 0.032 58)', heroA: '#4E140E', heroB: '#9A3418', hmwColor: '#F7C86B', heroBody: '#F6E0CE',\n      darkGrad: 'linear-gradient(165deg, #33100B 0%, #4E140E 55%, #7C2712 100%)', chapterTint: 'oklch(97.5% 0.028 62)',\n      darkText: '255, 236, 222', darkTrim: '247, 200, 139',\n      sections: [\n        { type: 'act', part: 'Part One', text: 'Where It Started' },\n        { type: 'heading', text: 'Overview' },\n        { type: 'text', text: 'In India, a snack is rarely just a snack. It is what appears when a guest arrives, what tea time is built around, what a festival tastes like, and what people carry with them when they travel. Every region has its own, and most people have one they grew up on.<br><br>Yet the moment someone moves away from home — for college, for work — that snack becomes surprisingly hard to get. <strong style=\"color: #000; font-weight: 700;\">SwaDish<\u002Fstrong> was an academic project that asked what an Indian snack subscription experience would look like if it started from that gap rather than from a catalogue.' },\n        { type: 'problemhero', label: 'The Problem', text: 'Snack buying online is organised around brands and categories, not around where a snack comes from. So someone looking for a specific regional item either settles for whatever is stocked nearby, or spends far too long searching across apps and sites — and once they finally find it, there is nothing that makes getting it again any easier.', hmw: 'How might we help people find the exact snack they are looking for — and make coming back for it effortless?' },\n        { type: 'heading', text: 'The Solution' },\n        { type: 'text', text: 'I designed one regional snack stop: many brands in a single catalogue, browsing that begins with <strong style=\"color: #000; font-weight: 700;\">where a snack comes from<\u002Fstrong>, a box assembled item by item, and a request path for anything not stocked yet.' },\n        { type: 'pillars', variant: 'open', color: '#A8421C', items: [\n          { title: 'Find', icon: 'map', text: 'Region is a primary way into the catalogue, so the taste of home is where someone starts rather than what they hunt for.' },\n          { title: 'Choose', icon: 'box', text: 'The box is built item by item in the quantities the buyer wants, instead of a fixed bundle they part-eat.' },\n          { title: 'Request Missing Items', icon: 'bell', text: 'Customers can request any item that is missing and subscribe to it once it arrives — so nobody is left disappointed that the snack they were craving is out of stock.' }\n        ] },\n        { type: 'heading', text: 'How I Worked Through It' },\n        { type: 'text', text: 'The project had to be broken into blocks so each layer could be resolved on its own before it became a screen. I used the <strong style=\"color: #000; font-weight: 700;\">5 Elements of UX<\u002Fstrong> as the spine — strategy first, surface last.' },\n        { type: 'image', src: 'img/em-44.webp' },\n        { type: 'act', part: 'Part Two', text: 'Understanding the User' },\n        { type: 'heading', text: 'Starting With What I Could Already See' },\n        { type: 'text', text: 'Before speaking to anyone, I wrote down what I had watched happen around me my whole life — because the cultural behaviour was the brief, and it was hiding in plain sight.' },\n        { type: 'list', items: [\n          'Snacks and sweets appear the moment a guest walks in.',\n          'Evening tea with the family is built around them.',\n          'Certain snacks belong to specific festivals, and some — like makhana — to fasting days.',\n          'Most people carry snacks with them when they travel.',\n          'Snacking has become a stress buster and a way to pass time.'\n        ] },\n        { type: 'subheading', text: 'And What Was Shifting in the Market' },\n        { type: 'list', items: [\n          'The pandemic had made people far more conscious of health and hygiene.',\n          'Urban buyers were leaning towards branded, packed edibles and national names over regional ones.',\n          'Younger buyers were willing to try unfamiliar flavours.',\n          'Busier lives were pushing demand towards ready-to-eat convenience.',\n          'People living away from family bought smaller packs, more often.'\n        ] },\n        { type: 'subheading', text: 'Talking to People Across States' },\n        { type: 'text', text: 'The interviews happened over video calls, since this was the middle of the COVID period. I deliberately spoke to people from different Indian states with different tastes, budgets and living situations, so the findings would not simply reflect one region.<br><br>The questions were sequenced to let people warm up — context and habits first, frustrations later — rather than opening with the heavy ones.' },\n        { type: 'image', src: 'img/em-45.webp' },\n        { type: 'subheading', text: 'What They Said, Did, Thought and Felt' },\n        { type: 'text', text: 'Each conversation was written up along those four lines, so a stray comment could later be traced back to the behaviour behind it.' },\n        { type: 'imagerow', items: [\n          'img/em-46.webp',\n          'img/em-47.webp',\n          'img/em-48.webp',\n          'img/Screenshot-2026-08-06-at-1.16.35-PM.png',\n          'img/Screenshot-2026-08-06-at-1.11.24-PM.png'\n        ] },\n        { type: 'subheading', text: 'Studying What Already Existed' },\n        { type: 'text', text: 'I studied the existing snack platforms against three of Jakob Nielsen’s heuristics — visibility of system status, recognition rather than recall, and aesthetic and minimalist design — to see where they were leaving people stranded.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_017736b030d4434db17cada297eae0b2~mv2.png' },\n        { type: 'subheading', text: 'Clustering the Pain Points' },\n        { type: 'text', text: 'Every frustration from the interviews went onto the wall, and the ones that shared a cause were grouped together.' },\n        { type: 'insightpanel', variant: 'stack', src: 'img/em-49.webp', cols: 'minmax(0, 1.35fr) minmax(0, 0.8fr)', maxw: '1180px', caption: 'Pain points grouped by what was actually causing them.', label: 'What Kept Coming Up', items: [\n          { icon: 'basket', title: 'The snack they wanted was simply not there', body: 'Regional items were missing from the platforms people already used, so the choice was between compromising and giving up.' },\n          { icon: 'search', title: 'Finding it took more effort than it was worth', body: 'Searching across apps, brand sites and local stores turned a small craving into a chore, and repeat purchases were no easier than the first one.' },\n          { icon: 'pack', title: 'Buying blind, in the wrong quantity', body: 'Thin product information and fixed pack sizes made people hesitate — especially those buying for one.' }\n        ] },\n        { type: 'subheading', text: 'Meet the Users' },\n        { type: 'text', text: 'Two personas came out of the synthesis — enough to keep the target audience concrete without designing for an average nobody.' },\n        { type: 'imagerow', items: [\n          'img/em-50.webp',\n          'img/em-51.webp'\n        ] },\n        { type: 'oppcallout', label: 'The Opportunity', text: 'Make the region the way into the catalogue rather than an afterthought — so the snack someone grew up on is one of the first things they see, not the last thing they find.' },\n        { type: 'act', part: 'Part Three', text: 'Framing the Opportunity' },\n        { type: 'heading', text: 'Four Problems, One Choice' },\n        { type: 'text', text: 'The pain points boiled down to four problems, and an academic timeline could not carry all four. So I mapped them against impact and effort before committing to one.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_330d6ab9611f4670b85d55cae11ec236~mv2.png', pad: '28px', inset: '28px' },\n        { type: 'subheading', text: 'Why Availability' },\n        { type: 'text', text: 'Availability was the problem people described most viscerally, and the one I could actually resolve in the time available. The information problem was already being handled well by a competitor (Snackible), so re-solving it would have added nothing.' },\n        { type: 'heading', text: 'Design Principles' },\n        { type: 'principles', intro: 'Three principles held the experience together once availability became the target.', items: [\n          { title: 'Region as the way in', text: 'People search by where a snack is from, so the product should let them.' },\n          { title: 'Choice, not a fixed basket', text: 'What goes in the box — and how much of it — belongs to the buyer.' },\n          { title: 'Never a dead end', text: 'If something is not stocked, the answer is a request, not an empty result.' }\n        ] },\n        { type: 'act', part: 'Part Four', text: 'Shaping the Experience' },\n        { type: 'heading', text: 'The Journey, Before and After' },\n        { type: 'text', text: 'Mapping Abhilash’s snack buying twice — once as it was, once as it would be with SwaDish — made it obvious which steps the product had to remove.' },\n        { type: 'subheading', text: 'Before SwaDish' },\n        { type: 'image', src: 'img/em-52.webp' },\n        { type: 'subheading', text: 'After SwaDish' },\n        { type: 'image', src: 'img/em-53.webp' },\n        { type: 'heading', text: 'User Flows' },\n        { type: 'text', text: 'Three flows carried the primary goals — ordering a snack, building a custom box, and subscribing to something someone knows they will want again.' },\n        { type: 'journeypills', label: 'The core journey', steps: ['Open', 'Pick a region', 'Browse brands', 'Build a box', 'Add to cart', 'Subscribe', 'Request what is missing'] },\n        { type: 'subheading', text: 'Flow 01 · Ordering a snack' },\n        { type: 'text', text: 'The shortest path: land, narrow by region or brand, and check out — the flow most people would repeat.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_6e5eef70061341fd806d4766d1d3e58e~mv2.png' },\n        { type: 'subheading', text: 'Flow 02 · Building a customised snack box' },\n        { type: 'text', text: 'The branching one: items and quantities are added one at a time, so the flow has to survive a buyer changing their mind mid-way.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_9bedd00232c545ce98bf922da8953199~mv2.png' },\n        { type: 'subheading', text: 'Flow 03 · Subscribing to an item' },\n        { type: 'text', text: 'The returning one: a snack someone already trusts is set to arrive on a schedule, which is where the second order stops being work.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_fc3055a3427a4057acb76034206753d0~mv2.png' },\n        { type: 'heading', text: 'Information Architecture' },\n        { type: 'text', text: 'With the flows settled, the structure decided what belonged together — and what a person should meet first.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_3d6e091b61a6454e8458596a6cc0362b~mv2.png' },\n        { type: 'heading', text: 'Visual Identity' },\n        { type: 'text', text: 'The identity had to read as food before it read as an app — warm, regional and a little handmade, rather than another clean grocery interface.' },\n        { type: 'image', src: 'https://static.wixstatic.com/media/0c9571_621d921034314eb7bdacfa1b83508387~mv2.jpg' },\n        { type: 'plainimage', src: 'https://static.wixstatic.com/media/0c9571_59618c02bf0a46db84d07f4976c4b692~mv2.png' },\n        { type: 'heading', text: 'The Designed Experience' },\n        { type: 'text', text: 'The mid-fi screens are grouped by the job they do, in the order someone meets them.' },\n        { type: 'mockupchapters', noFrame: true, chapters: [\n          { n: '01', title: 'The Regional Snack Stop', tone: 'light',\n            blurb: 'The two screens that answer “can I even get it here” — many brands in one place, and regions as the way to browse them.',\n            phones: [\n              { src: 'https://static.wixstatic.com/media/0c9571_1d1b3692179c4b168320971165b2b29b~mv2.png', caption: 'Multi-brand Snack Stop', solves: 'Only one brand per store', notes: [\n                  { side: 'left', top: '16%', label: 'Brands side by side', body: 'Several brands sit in one catalogue, so choosing does not mean opening another app.' },\n                  { side: 'left', top: '58%', label: 'Choice in the buyer’s hands', body: 'Nothing is pre-bundled — the shelf is browsed, not prescribed.' }\n              ] },\n              { src: 'https://static.wixstatic.com/media/0c9571_dedb17f1782446e79d990261026d5274~mv2.png', caption: 'Regional Categorisation', solves: 'Hometown snacks buried in categories', notes: [\n                  { side: 'right', top: '20%', label: 'Region first', body: 'The catalogue opens by place, so someone looking for the taste of home starts where it lives.' },\n                  { side: 'right', top: '64%', label: 'Recognise, not recall', body: 'Familiar regional names do the work instead of a search box.' }\n              ] }\n            ],\n            decisions: [\n              'Region promoted to a primary way of browsing',\n              'Multiple brands held in one catalogue rather than separate storefronts'\n            ] },\n          { n: '02', title: 'Your Box, Your Quantities', tone: 'dark',\n            blurb: 'Where the compromise disappears — the box is assembled item by item, and the cart states exactly what was chosen.',\n            phones: [\n              { src: 'https://static.wixstatic.com/media/0c9571_9f3c0f5c86114c39bd52151f0177bb46~mv2.png', caption: 'Customisable Snack Box', solves: 'Fixed packs and fixed bundles', notes: [\n                  { side: 'left', top: '18%', label: 'Only what they want', body: 'Items are added individually, so nobody pays for the half of a bundle they will not eat.' },\n                  { side: 'left', top: '62%', label: 'Right size for one', body: 'Quantities are chosen, which matters most for people buying for themselves.' }\n              ] },\n              { src: 'https://static.wixstatic.com/media/0c9571_a1e4cb75e6b640dca7cc95d402ddeac9~mv2.png', caption: 'Add to Cart', solves: 'Unclear system status', notes: [\n                  { side: 'right', top: '24%', label: 'One primary action', body: 'The main decision on a product page is a single, unmistakable button.' },\n                  { side: 'right', top: '68%', label: 'Confirmed immediately', body: 'The cart state changes in place, so nothing has to be re-checked.' }\n              ] }\n            ],\n            decisions: [\n              'Bundles replaced by per-item assembly',\n              'Quantity treated as part of the choice, not a checkout detail'\n            ] },\n          { n: '03', title: 'Subscribe and Repeat', tone: 'light',\n            blurb: 'The part that makes the second order easier than the first — for the snacks someone already knows they will want again.',\n            phones: [\n              { src: 'https://static.wixstatic.com/media/0c9571_25e2c14705444074b333768cfe0526b6~mv2.png', caption: 'Subscription', solves: 'Reordering as hard as ordering', notes: [\n                  { side: 'left', top: '22%', label: 'Habit, not a repeat search', body: 'A recurring item is set up once and arrives on its own after that.' },\n                  { side: 'left', top: '66%', label: 'Cadence stated plainly', body: 'How often and how much is written in words, not hidden in settings.' }\n              ] },\n              { src: 'https://static.wixstatic.com/media/0c9571_47304f6a03fe4d73994cc7354a4fae9d~mv2.png', caption: 'Subscription Confirmed', solves: 'Uncertainty after committing', notes: [\n                  { side: 'right', top: '30%', label: 'Say what happens next', body: 'The confirmation names what was subscribed to and when it comes.' }\n              ] }\n            ],\n            decisions: [\n              'Subscription offered on the product itself, where the intent already is',\n              'Every commitment closed with a plain-language confirmation'\n            ] },\n          { n: '04', title: 'When It Is Not in Stock', tone: 'dark',\n            blurb: 'The availability problem, answered directly — an empty result becomes a request instead of the end of the visit.',\n            phones: [\n              { src: 'https://static.wixstatic.com/media/0c9571_ecb18c2ea4884a369caa8ff6e3f26e7c~mv2.png', caption: 'Request Order', solves: 'Nothing to do when an item is missing', notes: [\n                  { side: 'left', top: '20%', label: 'Ask for it', body: 'A missing snack can be requested by name, turning a dead end into demand the platform can act on.' },\n                  { side: 'left', top: '64%', label: 'Low effort to ask', body: 'Only what is needed to source the item — no form standing between craving and request.' }\n              ] },\n              { src: 'https://static.wixstatic.com/media/0c9571_01d0d3707d2e475d9267864a62cb18cc~mv2.png', caption: 'Request Sent', solves: 'Requests that vanish silently', notes: [\n                  { side: 'right', top: '34%', label: 'Acknowledged', body: 'The request is confirmed, so the person knows it went somewhere.' }\n              ] }\n            ],\n            decisions: [\n              'Out-of-stock treated as a signal to collect, not an error to display',\n              'Request kept to a single step so it actually gets used'\n            ] }\n        ] },\n        { type: 'act', part: 'Part Five', text: 'What I Took Away' },\n        { type: 'heading', text: 'My Learning' },\n        { type: 'text', text: 'This was the project where I learned that <strong style=\"color: #000; font-weight: 700;\">culture is research data.<\u002Fstrong> The most useful insight in SwaDish was not something anyone said in an interview — it was the everyday behaviour around snacks that everybody took for granted, including me.' },\n        { type: 'text', text: 'Working through the 5 Elements also taught me the value of resolving one layer before touching the next. Priority mapping was uncomfortable — three real problems went unsolved — but choosing one made the product coherent instead of thin in four places.' },\n        { type: 'text', text: 'And availability turned out to be less about stock than about structure: the snack people wanted often existed somewhere 002Fspan><span>All case studies<\u002Fspan><\u002Fdiv>' +\n    '<section class=\"fadeup\" data-r=\"pad\" style=\"padding: 44px 56px 108px; max-width: 860px; margin: 0 auto;\">' + body + '<\u002Fsection>';\n}\n\nfunction renderAbout() {\n  var expHtml = experienceData.map(function (job) {\n    return '<div data-r=\"exp\" style=\"display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 24px 0; border-bottom: 1px solid oklch(91% 0.004 260); position: relative;\">' +\n      '<div style=\"font-size: 13.5px; color: oklch(50% 0.01 260); font-weight: 600;\">' + job.dates + '<\u002Fdiv>' +\n      '<div style=\"border-left: 2px solid ' + ACCENT + '; padding-left: 20px;\"><div style=\"font-family: \\'Sora\\', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 5px;\">' + job.role + ' · <span style=\"font-weight: 800; color: ' + ACCENT + ';\">' + job.company + '<\u002Fspan><\u002Fdiv>' +\n      '<div style=\"font-size: 15px; line-height: 1.6; color: oklch(40% 0.012 260);\">' + job.description + '<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  var eduHtml = educationData.map(function (edu) {\n    return '<div style=\"border-left: 2px solid ' + ACCENT + '; padding-left: 20px;\"><div style=\"font-family: \\'Sora\\', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 4px;\">' + edu.degree + '<\u002Fdiv><div style=\"font-size: 14px; color: oklch(50% 0.01 260); font-weight: 600;\">' + edu.meta + '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  var recHtml = recognitionsData.map(function (rec) {\n    return '<div style=\"border-left: 2px solid ' + ACCENT + '; padding-left: 20px;\"><div style=\"font-family: \\'Sora\\', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 3px;\">' + rec.title + ' <span style=\"font-weight: 600; color: oklch(50% 0.01 260); font-size: 14px;\">· ' + rec.meta + '<\u002Fspan><\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.6; color: oklch(40% 0.012 260);\">' + rec.description + '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  var skillsHtml = skillGroupsData.map(function (grp) {\n    return '<div><div style=\"font-size: 13px; font-weight: 700; color: ' + ACCENT + '; margin-bottom: 12px;\">' + grp.label + '<\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 8px;\">' +\n      grp.items.map(function (item) { return '<span style=\"font-size: 14.5px; color: oklch(32% 0.012 260); padding: 8px 14px; background: oklch(96.5% 0.003 260); border-radius: 9px; border: 1px solid oklch(91% 0.004 260);\">' + item + '<\u002Fspan>'; }).join('') + '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n\n  return '<section class=\"fadeup\" data-r=\"pad\" style=\"padding: 96px 56px 108px; max-width: 1120px; margin: 0 auto;\">' +\n    '<h1 data-r=\"abouth1\" style=\"font-family: \\'Sora\\', sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 26px;\">About me<\u002Fh1>' +\n    '<p style=\"font-size: 17.5px; line-height: 1.75; color: oklch(35% 0.012 260); margin: 0 0 20px;\">I am a Full-Stack UX/Product Designer with nearly 4 years of experience delivering end-to-end product design for enterprise SaaS, CRM, telecommunications, and AI-powered products at Verizon and Salesforce.<\u002Fp>' +\n    '<p style=\"font-size: 17.5px; line-height: 1.75; color: oklch(35% 0.012 260); margin: 0 0 20px;\">Whether I\\'m talking to users, mapping messy processes, or collaborating with cross-functional teams, I love uncovering the \"why\" behind problems and designing solutions that balance user needs with business goals. I am passionate about human-centered design, accessibility (WCAG), design systems, and creating thoughtful experiences that make technology easier to use.<\u002Fp>' +\n    '<a class=\"resume-btn\" href=\"' + RESUME_URL + '\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 8px; margin: 8px 0 60px; background: transparent; color: oklch(15% 0.01 260); padding: 12px 23px; border-radius: 100px; font-size: 14.5px; font-weight: 600; border: 1.5px solid oklch(15% 0.01 260 / 0.35);\">Résumé <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align: -1.5px;\"><path d=\"M12 3v13m0 0-4.5-4.5M12 16l4.5-4.5\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg><\u002Fa>' +\n    '<h2 style=\"font-family: \\'Sora\\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;\">Experience<\u002Fh2>' +\n    '<div style=\"display: flex; flex-direction: column; gap: 0; margin-bottom: 60px;\">' + expHtml + '<\u002Fdiv>' +\n    '<h2 style=\"font-family: \\'Sora\\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;\">Education<\u002Fh2>' +\n    '<div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 60px;\">' + eduHtml + '<\u002Fdiv>' +\n    '<h2 style=\"font-family: \\'Sora\\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;\">Recognitions<\u002Fh2>' +\n    '<div data-r=\"two\" style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 60px;\">' + recHtml + '<\u002Fdiv>' +\n    '<h2 style=\"font-family: \\'Sora\\', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(45% 0.01 260); font-weight: 700; margin: 0 0 26px;\">Skills<\u002Fh2>' +\n    '<div data-r=\"three\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;\">' + skillsHtml + '<\u002Fdiv><\u002Fsection>';\n}\n\nfunction render() {\n  var html = '';\n  if (state.view === 'home') html = renderHome();\n  else if (state.view === 'about') html = renderAbout();\n  else if (state.view === 'case') html = renderCaseStudy(projectsData.find(function (p) { return p.id === state.activeId; }) || projectsData[0]);\n  var host = document.getElementById('main-content');\n  var mount = host && host.querySelector('#app-root');\n  if (host && !mount) { mount = document.createElement('div'); mount.id = 'app-root'; host.appendChild(mount); }\n  if (mount) mount.innerHTML = html;\n  document.body.style.background = (state.view === 'case') ? '#FFFFFF' : 'oklch(97.2% 0.008 82)';\n\n  var homeActive = (state.view === 'home' || state.view === 'case');\n  var aboutActive = (state.view === 'about');\n  var homeEl = document.getElementById('nav-home'), aboutEl = document.getElementById('nav-about');\n  homeEl.style.color = homeActive ? 'oklch(18% 0.012 260)' : 'oklch(40% 0.01 260)';\n  homeEl.style.borderBottom = '2px solid ' + (homeActive ? ACCENT : 'transparent');\n  aboutEl.style.color = aboutActive ? 'oklch(18% 0.012 260)' : 'oklch(40% 0.01 260)';\n  aboutEl.style.borderBottom = '2px solid ' + (aboutActive ? ACCENT : 'transparent');\n}\n\n(function boot(){\n  var mc = document.getElementById('main-content');\n  if (!mc) { requestAnimationFrame(boot); return; }\n  var logo = document.getElementById('nav-logo'), nh = document.getElementById('nav-home'), na = document.getElementById('nav-about');\n  if (logo && !logo.dataset.bound) { logo.dataset.bound = '1'; logo.addEventListener('click', goHome); }\n  if (nh && !nh.dataset.bound) { nh.dataset.bound = '1'; nh.addEventListener('click', goHome); }\n  if (na && !na.dataset.bound) { na.dataset.bound = '1'; na.addEventListener('click', goAbout); }\n  try { render(); } catch (e) { console.error(e); }\n})();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
